<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KS Coder 2.5:7b</title>
<style>
:root{--bg:#ffffff;--panel:#f7fbff;--border:#dbeafe;--accent:#0ea5e9;--accent2:#38bdf8;--text:#0f172a;--muted:#64748b;--radius:12px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:white;font-weight:800}
.title{font-weight:700}
.title small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}.dot.ok{background:#10b981}.dot.bad{background:#ef4444}
.pill{font-size:12px;border:1px solid var(--border);background:var(--panel);padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:6px}
.wrap{max-width:800px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px;height:calc(100vh - 64px)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;flex:1}
.log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word;line-height:1.6;border:1px solid var(--border)}
.bubble.user{background:var(--accent);color:white;border-color:var(--accent);align-self:flex-end}
.bubble.assistant{background:white;align-self:flex-start}
.bubble.system{background:#eef6ff;color:var(--muted);font-size:12px;align-self:center;border-style:dashed}
.inputRow{padding:12px;border-top:1px solid var(--border);background:white;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}
select,input,textarea{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:white;color:var(--text);outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #e0f2fe}
textarea{width:100%;min-height:72px;resize:vertical}
.btn{background:var(--accent);color:white;border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn:hover{background:#0284c7}
.btn:disabled{opacity:.6}
pre{background:#f1f5f9;border:1px solid var(--border);border-radius:8px;padding:10px;overflow:auto}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>
<body>
<div class="top">
  <div class="logo">KS</div>
  <div class="title">KS Coder 2.5:7b <small>Qwen2.5-Coder-7B Q4 · WSS</small></div>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <span class="pill"><span class="dot" id="dot"></span><span id="wss">WSS …</span></span>
    <span class="pill" id="modelPill">ks-coder-2.5:7b</span>
  </div>
</div>

<div class="wrap">
  <div class="row">
    <label style="flex:1">Model
      <select id="modelSel" style="width:100%;margin-top:4px">
        <option value="ks-coder-2.5:7b">ks-coder-2.5:7b</option>
        <option value="qwen2.5-coder:7b">qwen2.5-coder:7b</option>
      </select>
    </label>
    <span class="pill" id="status">idle</span>
  </div>

  <div class="card">
    <div id="log" class="log"></div>
    <div class="inputRow">
      <textarea id="input" placeholder="Ask coding... e.g. write C reverse linked list"></textarea>
      <div class="row">
        <button id="send" class="btn">Send</button>
        <button id="clear" class="btn" style="background:white;color:var(--text);border:1px solid var(--border)">Clear</button>
        <span style="margin-left:auto;color:var(--muted);font-size:12px">Enter to send · Shift+Enter newline</span>
      </div>
    </div>
  </div>
</div>

<script>
const log=document.getElementById('log'),input=document.getElementById('input'),sendBtn=document.getElementById('send'),clearBtn=document.getElementById('clear'),modelSel=document.getElementById('modelSel'),dot=document.getElementById('dot'),wssText=document.getElementById('wss'),statusEl=document.getElementById('status'),modelPill=document.getElementById('modelPill');
let ws=null,connected=false,cur=null,curText='';
function add(role,text){const d=document.createElement('div');d.className='bubble '+role;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
function setStatus(t,ok){statusEl.textContent=t;dot.className='dot'+(ok===true?' ok':ok===false?' bad':'');wssText.textContent=ok===true?'WSS connected':ok===false?'WSS disconnected':'WSS …';}
async function fetchConfig(){
  try{const r=await fetch('/api/config');const j=await r.json();return j.wsUrl|| (location.protocol==='https:'?`wss://${location.host}/ws`:`ws://${location.host}/ws`);}catch{return location.protocol==='https:'?`wss://${location.host}/ws`:`ws://${location.host}/ws`;}
}
async function connect(){
  const url=await fetchConfig();
  if(ws)try{ws.close()}catch{}
  setStatus('connecting',null);
  ws=new WebSocket(url);
  ws.onopen=()=>{connected=true;setStatus('connected',true);add('system','✅ WSS connected — '+url);};
  ws.onclose=()=>{connected=false;setStatus('disconnected',false);add('system','⚠️ WSS disconnected');};
  ws.onerror=()=>setStatus('error',false);
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='start'){cur=null;curText='';}
    else if(m.type==='token'){
      if(!cur){cur=document.createElement('div');cur.className='bubble assistant';log.appendChild(cur);}
      curText+=m.content;cur.textContent=curText;log.scrollTop=log.scrollHeight;
    }
    else if(m.type==='done'){cur=null;curText='';sendBtn.disabled=false;sendBtn.textContent='Send';}
    else if(m.type==='error'){add('system','❌ '+m.message);sendBtn.disabled=false;}
  };
}
async function sendHttp(prompt){
  const model=modelSel.value;
  add('system','… http fallback');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,messages:[{role:'user',content:prompt}]})});
    const j=await r.json();
    if(j.content) add('assistant',j.content);
    else add('system',JSON.stringify(j).slice(0,500));
  }catch(e){add('system','http failed '+e.message)}
  sendBtn.disabled=false;
}
async function send(){
  const prompt=input.value.trim();if(!prompt)return;
  const model=modelSel.value;modelPill.textContent=model;
  add('user',prompt);input.value='';sendBtn.disabled=true;sendBtn.textContent='…';cur=null;curText='';
  if(connected&&ws&&ws.readyState===1){ws.send(JSON.stringify({type:'chat',model,messages:[{role:'user',content:prompt}],stream:true}));}
  else await sendHttp(prompt);
}
sendBtn.onclick=send;
clearBtn.onclick=()=>{log.innerHTML='';add('system','cleared');};
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
modelSel.onchange=()=>modelPill.textContent=modelSel.value;
fetch('/api/config').then(r=>r.json()).then(j=>{modelPill.textContent=j.model||modelSel.value;}).catch(()=>{});
connect();
add('system','👋 Ready — select model, type prompt, Send. WSS at /ws → ks-coder-2.5:7b');
</script>
</body>
</html>
