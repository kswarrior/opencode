name: KS MCPE Release

on:
  repository_dispatch:
    types: [ks-mcpe-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p ks-mcpe-launcher/release/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d \
            > ks-mcpe-launcher/release/signing/ks-mcpe.keystore
          chmod 600 ks-mcpe-launcher/release/signing/ks-mcpe.keystore

      - name: Build 1.0.9
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          APP_VERSION: '1.0.9'
          APP_VERSION_CODE: '10009'
          DIST: ${{ github.workspace }}/ks-mcpe-launcher/release
          KEYSTORE: ${{ github.workspace }}/ks-mcpe-launcher/release/signing/ks-mcpe.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          bash ks-mcpe-launcher/app/source/build.sh

      - name: Verify release certificate
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK="ks-mcpe-launcher/release/KS-MCPE-Launcher-1.0.9.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 \
            -type d | sort -V | tail -n 1)/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" \
            | grep -q 'a0b56fd5620536d734388203a0c4244194f07ba7a7cd3f6eb8d69a161e1de4e8'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="ks-mcpe-launcher/release/KS-MCPE-Launcher-1.0.9.apk"
          if gh release view v1.0.9 >/dev/null 2>&1; then
            echo "v1.0.9 already exists"
            exit 0
          fi
          gh release create v1.0.9 \
            "$APK" "$APK.sha256" \
            --target main \
            --latest=false \
            --title "KS MCPE Launcher (Java) v1.0.9" \
            --notes "1.0.9 applies the selected skin to the installed game before launch. ADD SKIN accepts 64x32, 64x64, and 128x128 PNGs, asks for Classic or Slim for 64x64 and 128x128, and writes the skin to both game data roots. Skin application is best-effort and depends on Minecraft's options format. The launcher engine remains LeviLauncher 1.7.1; the app is arm64-v8a only and does not include Minecraft."
