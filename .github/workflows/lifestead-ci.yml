name: Lifestead CI

on:
  push:
    paths:
      - 'ks-plugins/lifestead/**'
      - '.github/workflows/lifestead-ci.yml'
  pull_request:
    paths:
      - 'ks-plugins/lifestead/**'
      - '.github/workflows/lifestead-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ks-plugins/lifestead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ks-plugins/lifestead/e2e/package-lock.json
      - name: Build and unit test
        run: ./scripts/build.sh
      - name: Install E2E dependencies
        run: npm ci
        working-directory: ks-plugins/lifestead/e2e
      - name: End-to-end tests
        run: npm test
        working-directory: ks-plugins/lifestead/e2e
        env:
          E2E_PAPER_BUILD: '132'
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lifestead-plugin
          path: ks-plugins/lifestead/release/plugin/Lifestead-*.jar
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lifestead-e2e-server-log
          path: ks-plugins/lifestead/e2e/.server/logs/
          if-no-files-found: ignore
