<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ksx · Hello World over WSS</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <script src="/assets/htmx.min.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>ksx <span class="badge">HTMX + WSS</span></h1>
    <p class="muted">Minimalist live-fragment demo. If the socket is alive you will see
      <code>Hello World from ksx WSS!</code> streamed below — no page reload.</p>

    <div class="row">
      <span id="conn" class="pill pill-wait">connecting…</span>
      <button id="ping" type="button">send ping</button>
    </div>

    <!-- WSS HTML fragments land here (htmx-style swap: append). -->
    <div id="wss-feed" class="feed" aria-live="polite">
      <div class="wss-wait">waiting for first fragment…</div>
    </div>

    <footer class="muted small">
      ksx ultra-light manager · <code>ksx web --port 8080</code> · <code>ws://&lt;host&gt;/ws</code>
    </footer>
  </main>

  <script>
    (function () {
      var proto = location.protocol === "https:" ? "wss:" : "ws:";
      var ws = new WebSocket(proto + "//" + location.host + "/ws");
      var conn = document.getElementById("conn");
      var feed = document.getElementById("wss-feed");

      // htmx-style swap: append streamed HTML fragments as-is (server-escaped).
      ws.onopen = function () {
        conn.textContent = "wss live ●";
        conn.className = "pill pill-ok";
      };
      ws.onclose = function () {
        conn.textContent = "wss closed ○";
        conn.className = "pill pill-err";
      };
      ws.onerror = function () {
        conn.textContent = "wss error ○";
        conn.className = "pill pill-err";
      };
      ws.onmessage = function (ev) {
        var clear = feed.querySelector(".wss-wait");
        if (clear) clear.remove();
        // Server sends trusted HTML fragments (same-origin WSS).
        feed.insertAdjacentHTML("beforeend", ev.data);
      };
      document.getElementById("ping").onclick = function () {
        if (ws.readyState === WebSocket.OPEN) ws.send("ping from browser");
      };
    })();
  </script>
</body>
</html>
