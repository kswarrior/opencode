# KS SSH — single-TOML recipe.
# Canonical registry: registry/packages/ssh.toml
# CDN mirror: https://raw.githubusercontent.com/kswarrior/opencode/refs/heads/main/registry/packages/ssh.toml
# This copy is the EMBEDDED BASELINE baked into the ksx binary via rust-embed
# (tier-4 fallback). Local cache: ~/.ksx/cache/ssh.toml (24h TTL).

[service]
name = "ssh"
version = "1.0.0"
description = "KS SSH — hardened OpenSSH bastion. Single-TOML recipe with embedded configs."

[requirements]
os = ["linux"]
min_ram_mb = 256
docker = "none"

[files.hardening]
path = "~/.ksx/ssh/ksx-sshd.conf"
content = """
# ksx-managed sshd hardening snippet (review before applying system-wide)
PasswordAuthentication no
PermitRootLogin prohibit-password
X11Forwarding no
"""

[[install.steps]]
name = "install openssh"
run = """
set -euo pipefail
if command -v apt-get >/dev/null; then
  sudo apt-get update && sudo apt-get install -y openssh-server
elif command -v apk >/dev/null; then
  sudo apk add openssh
else
  echo "install openssh manually for your distro"
fi
"""

[[install.steps]]
name = "stage hardening snippet"
run = """
set -euo pipefail
mkdir -p ~/.ksx/ssh
echo "hardening snippet staged at ~/.ksx/ssh/ksx-sshd.conf (review, then copy to /etc/ssh/sshd_config.d/)"
"""

[[update.steps]]
name = "refresh openssh"
run = """
set -euo pipefail
if command -v apt-get >/dev/null; then
  sudo apt-get update && sudo apt-get install -y --only-upgrade openssh-server
elif command -v apk >/dev/null; then
  sudo apk upgrade openssh
else
  echo "update openssh manually for your distro"
fi
"""

[[reinstall.steps]]
name = "reinstall openssh"
run = """
set -euo pipefail
if command -v apt-get >/dev/null; then
  sudo apt-get update && sudo apt-get install -y --reinstall openssh-server
elif command -v apk >/dev/null; then
  sudo apk fix openssh
else
  echo "reinstall openssh manually for your distro"
fi
"""

[[info.steps]]
name = "sshd status"
run = """
set -euo pipefail
(command -v sshd >/dev/null && sshd -T 2>/dev/null | grep -iE 'passwordauthentication|permitrootlogin') || echo "sshd not installed or not queryable"
"""
