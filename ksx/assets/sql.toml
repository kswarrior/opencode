# KS SQL — single-TOML package recipe.
# Canonical registry: registry/packages/sql.toml
# CDN mirror: https://raw.githubusercontent.com/kswarrior/opencode/refs/heads/main/registry/packages/sql.toml
# This copy is the EMBEDDED BASELINE baked into the ksx binary via rust-embed
# (tier-4 fallback). Local cache: ~/.ksx/cache/sql.toml (24h TTL).

[service]
name = "sql"
version = "1.0.0"
description = "KS SQL — Postgres ${POSTGRES_IMAGE} on :${SQL_PORT}."
summary = "Postgres for ksx apps (db ${POSTGRES_DB})"

[requirements]
os = ["linux", "darwin"]
arch = ["amd64", "arm64"]

min_ram_mb = 512
ram_mode = "force"
ram_echo_success = "ram OK for postgres"
ram_echo_fail = "ram FAIL: need 512MB for postgres"

min_disk_mb = 1024
disk_mode = "optional"
disk_echo_success = "disk OK for pgdata"
disk_echo_fail = "disk LOW for pgdata"

root_required = false
root_mode = "check"
root_echo_success = "root check: userland docker run is fine"

[[requirements.directories]]
path = "~/.ksx/sql"
create = true
mode = "755"
required_for = ["install", "info"]
description = "sql staging dir (init.sql)"
echo_success = "dir OK: ${DATA_DIR} ready"
echo_fail = "dir FAIL: ${DATA_DIR}"

[[requirements.dependencies]]
name = "docker"
check_cmd = "docker info >/dev/null 2>&1"
mode = "force"
required_for = ["install", "update", "reinstall", "uninstall"]
echo_success = "docker OK for ${POSTGRES_IMAGE}"
echo_fail = "docker FAIL: postgres runs containerized"

[[env]]
mode = "both"
target_path = "~/.ksx/sql/sql.env"
required_for = ["install", "reinstall"]
values = { SQL_PORT = "5432", POSTGRES_DB = "ksx", POSTGRES_IMAGE = "postgres:16-alpine", DATA_DIR = "~/.ksx/sql" }

[[files]]
target_path = "~/.ksx/sql/init.sql"
required_for = ["install"]
echo_success = "seed staged for db ${POSTGRES_DB}"
echo_fail = "seed FAILED"
content = """
-- ksx-managed seed for ${POSTGRES_DB} (idempotent)
CREATE TABLE IF NOT EXISTS ksx_meta (k TEXT PRIMARY KEY, v TEXT);
INSERT INTO ksx_meta (k, v) VALUES ('managed_by', 'ksx')
ON CONFLICT (k) DO NOTHING;
"""

[[steps]]
name = "start postgres"
required_for = ["install"]
script = """
set -euo pipefail
docker run -d --name ksx-sql --restart unless-stopped \
  -e POSTGRES_PASSWORD=ksx -p "${SQL_PORT}:5432" "${POSTGRES_IMAGE}"
sleep 3
docker exec ksx-sql pg_isready -U postgres
"""
echo_success = "postgres up on :${SQL_PORT}"
echo_fail = "postgres start FAILED"

[[steps]]
name = "recreate postgres"
required_for = ["update", "reinstall"]
script = """
set -euo pipefail
docker pull "${POSTGRES_IMAGE}"
docker stop ksx-sql || true
docker rm ksx-sql || true
docker run -d --name ksx-sql --restart unless-stopped \
  -e POSTGRES_PASSWORD=ksx -p "${SQL_PORT}:5432" "${POSTGRES_IMAGE}"
docker exec ksx-sql pg_isready -U postgres
"""
echo_success = "postgres recreated from ${POSTGRES_IMAGE}"
echo_fail = "postgres recreate FAILED"

[[steps]]
name = "drop postgres"
required_for = ["uninstall"]
script = """
set -euo pipefail
docker stop ksx-sql || true
docker rm -v ksx-sql || true
echo "dropped ksx-sql (${POSTGRES_DB})"
"""
echo_success = "postgres dropped"
echo_fail = "postgres drop FAILED"

[[steps]]
name = "postgres status"
required_for = ["info"]
script = """
set -euo pipefail
docker exec ksx-sql pg_isready -U postgres || echo "ksx-sql not running (wants :${SQL_PORT})"
"""
echo_success = "status reported"
echo_fail = "status FAILED"
