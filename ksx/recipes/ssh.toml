[service]
name = "ssh"
version = "1.0.0"
description = "KS SSH — hardened OpenSSH bastion. Embedded baseline recipe."

[requirements]
os = ["linux"]
min_ram_mb = 256
docker = "none"

[[steps]]
name = "install openssh"
run = """
set -euo pipefail
if command -v apt-get >/dev/null; then
  sudo apt-get update && sudo apt-get install -y openssh-server
elif command -v apk >/dev/null; then
  sudo apk add openssh
else
  echo "install openssh manually for your distro"
fi
"""

[[steps]]
name = "harden sshd"
run = """
set -euo pipefail
sudo mkdir -p /etc/ssh/sshd_config.d
echo "PasswordAuthentication no" | sudo tee /etc/ssh/sshd_config.d/ksx.conf
sudo systemctl reload sshd || sudo service ssh reload || true
"""
