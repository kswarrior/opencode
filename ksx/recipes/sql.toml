[service]
name = "sql"
version = "1.0.0"
description = "KS SQL — lightweight Postgres for KS apps. Embedded baseline recipe."

[requirements]
os = ["linux"]
min_ram_mb = 512
docker = "optional"

[[steps]]
name = "start postgres"
run = """
set -euo pipefail
docker run -d --name ksx-sql --restart unless-stopped \
  -e POSTGRES_PASSWORD=ksx -p 5432:5432 postgres:16-alpine
sleep 3
docker exec ksx-sql pg_isready -U postgres
"""
