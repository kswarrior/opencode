[package]
name = "ksx"
version = "0.1.11"
edition = "2021"
description = "Ultra-lightweight CLI + WebUI to manage KS Panel (Docker/KVM), KS SSH, and KS SQL"
license = "MIT"
repository = "https://github.com/anomalyco/opencode"
keywords = ["cli", "devops", "docker", "kvm", "webui"]
categories = ["command-line-utilities"]

[[bin]]
name = "ksx"
path = "backend/src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "process", "io-util", "signal"] }
axum = { version = "0.7" }
clap = { version = "4", features = ["derive", "env", "help", "usage"] }
rust-embed = { version = "8", features = ["include-exclude"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse", "display"] }
dirs = "6"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
