# KS SSH — single-TOML package recipe (canonical source).
# Served from : registry/packages/ssh.toml
# CDN mirror  : https://raw.githubusercontent.com/kswarrior/opencode/refs/heads/main/registry/packages/ssh.toml

[service]
name = "ssh"
version = "1.0.0"
description = "KS SSH — hardened OpenSSH bastion (${SSH_PORT})."
summary = "SSH bastion for ${SSH_USER}@${SSH_PORT}"

[requirements]
os = ["linux", "darwin"]
arch = ["amd64", "arm64"]

min_ram_mb = 256
ram_mode = "force"
ram_echo_success = "ram OK for sshd"
ram_echo_fail = "ram FAIL: need 256MB for sshd"

min_disk_mb = 128
disk_mode = "optional"
disk_echo_success = "disk OK for sshd"
disk_echo_fail = "disk LOW for sshd logs"

root_required = false
root_mode = "check"
root_echo_success = "root check: unprivileged ok (snippet staged under ~/.ksx)"

[[requirements.directories]]
path = "~/.ksx/packages/ssh"
create = true
mode = "700"
required_for = ["install", "info"]
description = "ssh staging dir"
echo_success = "dir OK: ${DATA_DIR} ready"
echo_fail = "dir FAIL: ${DATA_DIR}"

[[requirements.dependencies]]
name = "sshd-or-ssh"
check_cmd = "command -v sshd >/dev/null 2>&1 || command -v ssh >/dev/null 2>&1"
mode = "optional"
required_for = ["install", "info"]
echo_success = "ssh tooling present"
echo_fail = "no sshd/ssh binary (will install)"

[[env]]
mode = "interpolate"
values = { SSH_PORT = "2222", SSH_USER = "ksx", DATA_DIR = "~/.ksx/packages/ssh", HARDENING = "prohibit-password" }

[[env]]
mode = "file"
target_path = "~/.ksx/packages/ssh/ssh.env"
required_for = ["install", "reinstall"]
values = { SSH_PORT = "2222", SSH_USER = "ksx", DATA_DIR = "~/.ksx/packages/ssh" }

[[files]]
target_path = "~/.ksx/packages/ssh/ksx-sshd.conf"
required_for = ["install", "reinstall"]
echo_success = "hardening snippet staged for port ${SSH_PORT}"
echo_fail = "hardening snippet FAILED"
content = """
# ksx-managed sshd snippet — port ${SSH_PORT}, user ${SSH_USER}
Port ${SSH_PORT}
PasswordAuthentication no
PermitRootLogin ${HARDENING}
X11Forwarding no
"""

[[steps]]
name = "install openssh"
required_for = ["install"]
script = """
set -euo pipefail
if command -v apt-get >/dev/null; then
  sudo apt-get update && sudo apt-get install -y openssh-server
elif command -v apk >/dev/null; then
  sudo apk add openssh
else
  echo "install openssh manually for ${SSH_USER}"
fi
"""
echo_success = "openssh install attempted"
echo_fail = "openssh install FAILED"

[[steps]]
name = "refresh openssh"
required_for = ["update"]
script = """
set -euo pipefail
if command -v apt-get >/dev/null; then
  sudo apt-get update && sudo apt-get install -y --only-upgrade openssh-server
elif command -v apk >/dev/null; then
  sudo apk upgrade openssh
else
  echo "update openssh manually"
fi
"""
echo_success = "openssh refreshed"
echo_fail = "openssh refresh FAILED"

[[steps]]
name = "remove snippet"
required_for = ["uninstall"]
script = """
set -euo pipefail
rm -f "${DATA_DIR}/ksx-sshd.conf"
echo "snippet removed for ${SSH_USER}"
"""
echo_success = "ssh uninstalled"
echo_fail = "ssh uninstall FAILED"

[[steps]]
name = "sshd status"
required_for = ["info"]
script = """
set -euo pipefail
(command -v sshd >/dev/null && sshd -T 2>/dev/null | grep -iE 'passwordauthentication|permitrootlogin') || echo "sshd not installed (port ${SSH_PORT} unconfigured)"
"""
echo_success = "status reported"
echo_fail = "status FAILED"
