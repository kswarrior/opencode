# KS Test — lightweight e2e recipe (panel.toml-style schema, no docker).
# Served from : registry/packages/test.toml
# CDN mirror  : https://raw.githubusercontent.com/kswarrior/opencode/refs/heads/main/registry/packages/test.toml
# Local cache : ~/.ksx/cache/test.toml (24h TTL) | Embedded fallback via include_str!.
#
# Same full schema as panel.toml (requirements with echo logs, directories +
# dependency guards, decoupled [[env]] file vs interpolation, platform-filtered
# [[files]] templates, reusable [[steps]] scoped by required_for), but every
# step is a safe local shell (mkdir/echo/cat) so frontend e2e can click
# Install -> Update -> Reinstall -> Info -> Uninstall and always succeed.

[service]
name = "test"
version = "1.0.0"
description = "KS Test — e2e fixture on port ${TEST_PORT}."
summary = "Test v${TEST_VERSION} for ${DATA_DIR}"

[requirements]
os = ["linux", "darwin"]
arch = ["amd64", "arm64"]

min_ram_mb = 16
ram_mode = "force"
ram_echo_success = "ram OK: ${TEST_PORT} fixture fits in memory"
ram_echo_fail = "ram FAIL: need 16MB for the test fixture"

min_disk_mb = 16
disk_mode = "optional"
disk_echo_success = "disk OK for test fixture"
disk_echo_fail = "disk LOW: test fixture wants 16MB free"

root_required = false
root_mode = "check"
root_echo_success = "root check: running unprivileged (fine for ~/.ksx)"

[[requirements.directories]]
path = "~/.ksx/packages/test"
create = true
mode = "755"
required_for = ["install", "update", "reinstall", "info"]
description = "test working dir (env file, templates, state)"
echo_success = "dir OK: test home ready at ${DATA_DIR}"
echo_fail = "dir FAIL: cannot prepare ${DATA_DIR}"

[[requirements.dependencies]]
name = "sh"
check_cmd = "command -v sh >/dev/null 2>&1"
mode = "force"
required_for = ["install", "reinstall", "uninstall"]
echo_success = "sh OK for ${TEST_IMAGE}"
echo_fail = "sh FAIL: shell required for the test fixture"

[[requirements.dependencies]]
name = "curl"
check_cmd = "command -v curl >/dev/null 2>&1"
mode = "optional"
required_for = ["install", "info"]
echo_success = "curl present (health probes enabled)"
echo_fail = "curl missing (health probes degraded)"

[[requirements.dependencies]]
name = "kvm"
check_cmd = "test -e /dev/kvm"
mode = "check"
required_for = ["info"]
echo_success = "kvm device present (hardware virt available)"
echo_fail = "kvm device absent (software virt only)"

# --- Environment: disk .env creation DECOUPLED from interpolation scope ---

[[env]]
mode = "interpolate"
values = { TEST_PORT = "9443", TEST_IMAGE = "ksx/test:fixture", DATA_DIR = "~/.ksx/packages/test", TEST_VERSION = "1.0.0", COMPOSE_PROJECT_NAME = "ksx-test" }

[[env]]
mode = "file"
target_path = "~/.ksx/packages/test/test.env"
required_for = ["install", "update", "reinstall"]
values = { TEST_PORT = "9443", TEST_IMAGE = "ksx/test:fixture", DATA_DIR = "~/.ksx/packages/test", TEST_VERSION = "1.0.0" }

# --- Embedded files (interpolated, platform-filtered) ---

[[files]]
target_path = "~/.ksx/packages/test/compose.txt"
required_for = ["install", "reinstall"]
only_os = ["linux"]
echo_success = "compose template rendered for port ${TEST_PORT}"
echo_fail = "compose template FAILED for ${DATA_DIR}"
content = """
fixture: ${TEST_IMAGE}
port: "${TEST_PORT}:8443"
data: ${DATA_DIR}/data
"""

[[files]]
target_path = "~/.ksx/packages/test/README.txt"
required_for = ["install"]
exclude_os = ["windows"]
echo_success = "test readme staged"
echo_fail = "test readme FAILED"
content = """
KS Test ${TEST_VERSION} — managed by ksx.
Compose project: ${COMPOSE_PROJECT_NAME} | Port: ${TEST_PORT}
Data: ${DATA_DIR}
"""

# --- Reusable steps (required_for + platform filters, ${VAR} scripts) ---
# All steps are local-only (no docker/network/sudo) for deterministic e2e.

[[steps]]
name = "check shell"
required_for = ["install"]
script = """
set -euo pipefail
command -v sh >/dev/null
echo "shell OK: sh present for ${TEST_IMAGE}"
"""
echo_success = "shell gate passed"
echo_fail = "shell gate FAILED"

[[steps]]
name = "stage test fixture"
required_for = ["install", "update"]
script = """
set -euo pipefail
mkdir -p "${DATA_DIR}"
echo "${TEST_IMAGE}" > "${DATA_DIR}/image.txt"
cat "${DATA_DIR}/image.txt"
"""
echo_success = "staged ${TEST_IMAGE}"
echo_fail = "stage FAILED for ${TEST_IMAGE}"

[[steps]]
name = "start test fixture"
required_for = ["install", "reinstall"]
only_os = ["linux", "darwin"]
script = """
set -euo pipefail
mkdir -p "${DATA_DIR}"
echo "up ${COMPOSE_PROJECT_NAME} on ${TEST_PORT}" > "${DATA_DIR}/status.txt"
cat "${DATA_DIR}/status.txt"
"""
echo_success = "test fixture up on ${TEST_PORT}"
echo_fail = "test fixture FAILED in ${DATA_DIR}"

[[steps]]
name = "verify test health"
required_for = ["install"]
script = """
set -euo pipefail
test -f "${DATA_DIR}/status.txt" && cat "${DATA_DIR}/status.txt"
echo "health probe done for :${TEST_PORT}"
"""
echo_success = "health probe done for :${TEST_PORT}"
echo_fail = "health probe FAILED"

[[steps]]
name = "refresh fixture"
required_for = ["update"]
script = """
set -euo pipefail
mkdir -p "${DATA_DIR}"
echo "refreshed ${TEST_IMAGE}" > "${DATA_DIR}/status.txt"
cat "${DATA_DIR}/status.txt"
"""
echo_success = "test updated to ${TEST_IMAGE}"
echo_fail = "test update FAILED"

[[steps]]
name = "tear down fixture"
required_for = ["reinstall", "uninstall"]
script = """
set -euo pipefail
rm -f "${DATA_DIR}/status.txt" "${DATA_DIR}/image.txt" || true
echo "torn down ${COMPOSE_PROJECT_NAME}"
"""
echo_success = "test torn down"
echo_fail = "teardown FAILED"

[[steps]]
name = "fixture status"
required_for = ["info"]
script = """
set -euo pipefail
cat "${DATA_DIR}/status.txt" 2>/dev/null || echo "test not installed (no ${DATA_DIR}/status.txt)"
"""
echo_success = "status reported"
echo_fail = "status FAILED"

[[steps]]
name = "health probe"
required_for = ["info"]
script = """
set -euo pipefail
test -f "${DATA_DIR}/status.txt" && echo "fixture reachable on :${TEST_PORT}" || echo "fixture not reachable"
"""
echo_success = "probe done"
echo_fail = "probe FAILED"
