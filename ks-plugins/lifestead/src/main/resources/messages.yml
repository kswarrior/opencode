commands:
  help-header: '&8&m-----&r &cLifestead &7Commands &8&m-----'
  help:
    - '&c/ls help &8- &7Show this help.'
    - '&c/ls hearts [player] &8- &7View heart counts.'
    - '&c/ls withdraw [amount] &8- &7Turn hearts into items.'
    - '&c/ls deposit [amount] &8- &7Turn heart items into hearts.'
    - '&c/ls recipe [heart|beacon|all] &8- &7Open the recipe viewer.'
    - '&c/ls revive <player> &8- &7Revive an eliminated player.'
    - '&c/ls giveheart <player> [amount] &8- &7Give heart items.'
    - '&c/ls sethearts <player> <amount> &8- &7Set a heart count.'
    - '&c/ls eliminate <player> &8- &7Eliminate a player.'
    - '&c/ls reset <player|all> &8- &7Reset hearts and elimination.'
    - '&c/ls top [hearts|kills|revives] &8- &7Show the leaderboard.'
    - '&c/ls status &8- &7Show storage and integration status.'
    - '&c/ls audit [limit] &8- &7Show recent audit entries.'
    - '&c/ls deathban <list|purge> &8- &7Manage deathbans.'
    - '&c/ls migrate <yaml|sqlite|mysql> &8- &7Copy data to another backend.'
    - '&c/ls reload &8- &7Reload configuration and recipes.'
