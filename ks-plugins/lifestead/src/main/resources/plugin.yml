# KS Lifestead - by KS Warrior
# Websites: https://ks.42web.io | https://ksx.pages.dev
# YouTube, Discord, Instagram: ks_warrior_pro

name: Lifestead
version: '${project.version}'
main: dev.lifestead.LifesteadPlugin
api-version: '1.21.11'
authors: [KS Warrior]
description: KS Lifestead - Lifesteal SMP hearts, elimination, revival, heart items, and recipes.
website: https://ks.42web.io
softdepend: [PlaceholderAPI, WorldGuard]
# Folia is not supported: the plugin uses the Bukkit scheduler.

commands:
  lifestead:
    description: Main Lifestead command.
    usage: /lifestead help
    aliases: [ls, lifesteal]
    permission: lifesteal.use

permissions:
  lifesteal.use:
    description: Use the base Lifestead command.
    default: true
  lifesteal.hearts:
    description: View your own hearts.
    default: true
  lifesteal.hearts.others:
    description: View another player's hearts.
    default: op
  lifesteal.withdraw:
    description: Withdraw hearts as items.
    default: true
  lifesteal.deposit:
    description: Deposit heart items.
    default: true
  lifesteal.recipe:
    description: Open the recipe viewer.
    default: true
  lifesteal.revive:
    description: Revive eliminated players.
    default: op
  lifesteal.give:
    description: Give heart items to players.
    default: op
  lifesteal.set:
    description: Set a player's heart count.
    default: op
  lifesteal.eliminate:
    description: Eliminate players.
    default: op
  lifesteal.reset:
    description: Reset heart and elimination state.
    default: op
  lifesteal.reload:
    description: Reload the plugin configuration.
    default: op
  lifesteal.top:
    description: View leaderboards.
    default: true
  lifesteal.status:
    description: View storage and integration status.
    default: op
  lifesteal.audit:
    description: View the audit log.
    default: op
  lifesteal.migrate:
    description: Migrate data between storage backends.
    default: op
  lifesteal.deathban:
    description: Manage deathbans.
    default: op
  lifesteal.revive.unlimited:
    description: Bypass the maximum revive count.
    default: op
  lifesteal.combat.bypass:
    description: Use blocked commands while in combat.
    default: op
  lifesteal.bypass.worldguard:
    description: Bypass WorldGuard heart-loss checks.
    default: op
  lifesteal.admin:
    description: Grants all Lifestead administration permissions.
    default: op
    children:
      lifesteal.use: true
      lifesteal.hearts: true
      lifesteal.hearts.others: true
      lifesteal.withdraw: true
      lifesteal.deposit: true
      lifesteal.recipe: true
      lifesteal.revive: true
      lifesteal.give: true
      lifesteal.set: true
      lifesteal.eliminate: true
      lifesteal.reset: true
      lifesteal.reload: true
      lifesteal.top: true
      lifesteal.status: true
      lifesteal.audit: true
      lifesteal.migrate: true
      lifesteal.deathban: true
      lifesteal.revive.unlimited: true
      lifesteal.combat.bypass: true
      lifesteal.bypass.worldguard: true
