# KS Lifestead - by KS Warrior
# Websites: https://ks.42web.io | https://ksx.pages.dev
# YouTube, Discord, Instagram: ks_warrior_pro

# Lifestead configuration
# Colors use & codes and &#RRGGBB hex codes.

language: en

database:
  # YAML, SQLITE, or MYSQL. SQLite and the MariaDB driver are bundled.
  # Switching this value requires a server restart; /ls reload only warns.
  type: YAML
  mysql:
    host: 127.0.0.1
    port: 3306
    database: lifestead
    username: root
    password: ''
    # Leave blank to build a jdbc:mariadb URL from the values above.
    jdbc-url: ''
    table-prefix: lifestead_
    pool-size: 4
    connection-timeout-ms: 5000
    use-ssl: false

settings:
  start-hearts: 10
  # Floor for heart loss. Above 0, deaths cannot reach zero, which disables
  # normal elimination by heart loss. Keep at 0 for elimination gameplay.
  minimum-hearts: 0
  maximum-hearts: 20
  gain-per-kill: 1
  lose-per-death: 1
  # Hearts that can never be withdrawn. The guard is applied on top of the minimum.
  # Invalid or out-of-range values are clamped with a startup warning.
  withdraw-guard: 1
  # Worlds where heart stealing and heart loss are disabled.
  disabled-worlds: []
  # How often online players have their max-health attribute resynced.
  health-resync-ticks: 40

# Per-world overrides. Unspecified values inherit the global settings above.
# Set enabled to false to disable Lifestead in a world.
worlds: {}
# Example:
# worlds:
#   world_nether:
#     enabled: true
#     start-hearts: 10
#     minimum-hearts: 0
#     maximum-hearts: 20
#     gain-per-kill: 1
#     lose-per-death: 1
#     pvp: true
#     withdraw: true
#     revive: true
#     item-use: true

death-loss:
  pvp: true
  mob: true
  environment: true

anti-farm:
  enabled: true
  # Seconds before the same killer can gain a heart from the same victim again.
  victim-cooldown-seconds: 300
  # Block heart gain when killer and victim share an IP address.
  same-ip: true
  # Maximum rewarded kills on the same victim inside the window below.
  # 0 disables the cap and the window. State persists in antifarm.yml.
  max-kills-per-victim: 3
  window-minutes: 60

progression:
  # Global cooldown between rewarded kills for one player. 0 disables it.
  gain-cooldown-seconds: 0

combat-log:
  enabled: true
  # Seconds after taking damage during which logging out counts as combat logging.
  duration-seconds: 15
  # Hearts lost when a player combat logs. The tag and penalty persist across
  # restarts and crashes; an outstanding penalty is applied when the player joins.
  penalty-hearts: 1
  bossbar: false
  actionbar: false
  block-commands: false
  blocked-commands:
    - /home
    - /spawn
    - /tpa
    - /tpaccept
    - /warp
  blocked-message: '&cYou cannot use that command while in combat.'

grace:
  enabled: false
  duration-seconds: 300
  on-join: true
  on-revive: true
  block-damage: true
  block-gain: true
  block-loss: true

elimination:
  # BAN or SPECTATOR.
  mode: BAN
  ban-reason: '&cYou ran out of hearts. You can be revived with a Revive Beacon.'
  announce: true
  # Extra hearts awarded to the killer when an elimination is caused by PvP.
  bonus-heart: 0
  commands: []

deathban:
  enabled: false
  # 0 means a permanent ban when enabled; otherwise the ban expires automatically.
  duration-seconds: 0
  actionbar: true
  bossbar: true

revive:
  hearts: 4
  teleport-to-spawn: true
  # Empty uses the player's current world. An unknown world falls back with a warning.
  spawn-world: ''
  # Set use-coordinates to true to use the coordinates below instead of world spawn.
  # Unsafe or out-of-border locations are searched nearby; a safe fallback is used.
  use-coordinates: false
  coordinates:
    x: 0.0
    y: 64.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0
  confirm: false
  # Heart items consumed from the reviving player. 0 disables the cost.
  cost-heart-items: 0
  # Optional ritual delay before an online revive completes.
  cast-seconds: 0
  # Maximum revives one player may receive. 0 is unlimited.
  max-per-player: 0
  commands: []

effects:
  sounds: true
  particles: true
  steal-sound: ENTITY_PLAYER_LEVELUP
  lose-sound: ENTITY_PLAYER_HURT
  revive-sound: BLOCK_BEACON_ACTIVATE
  heart-particle: HEART
  # Clamped to 1-200 to avoid client/server lag.
  particle-count: 12
  # Broadcast every successful heart steal to the whole server.
  broadcast-steals: false

pvp:
  totems: true
  crystals: true
  respawn-anchors: true
  beds: true

drops:
  # DIRECT gives the heart item directly to the killer, ITEM drops it in the world,
  # and NONE preserves the classic direct heart transfer.
  pvp: NONE
  natural: NONE
  max-hearts: NONE
  cooldown-seconds: 0
  auto-give: true
  pickup-delay-ticks: 20
  despawn-seconds: 300
  invulnerable: true

items:
  heart:
    material: NETHER_STAR
    name: '&cHeart'
    lore:
      - '&7Right-click to gain &c1 heart&7.'
      - '&8Raises your maximum health.'
    glow: true
    custom-model-data: 1001
    # Optional namespaced item-model, for example ks:heart.
    item-model: ''
    # Empty means all worlds where item use is enabled.
    worlds: []
    commands: []
  revive-beacon:
    material: BEACON
    name: '&dRevive Beacon'
    lore:
      - '&7Right-click to open the revival menu.'
      - '&8Consumed when a player is revived.'
    glow: true
    custom-model-data: 1002
    item-model: ''
    worlds: []
    consume-on-revive: true

recipes:
  heart:
    enabled: true
    shaped: true
    result-amount: 1
    shape:
      - ' D '
      - 'GNG'
      - ' R '
    ingredients:
      D: DIAMOND
      G: GOLD_BLOCK
      N: NETHER_STAR
      R: REDSTONE_BLOCK
  revive-beacon:
    enabled: true
    shaped: true
    result-amount: 1
    shape:
      - ' T '
      - 'SWA'
      - 'NNN'
    ingredients:
      T: TOTEM_OF_UNDYING
      S: NETHER_STAR
      W: WITHER_SKELETON_SKULL
      A: ENCHANTED_GOLDEN_APPLE
      N: NETHERITE_BLOCK

leaderboard:
  enabled: true
  size: 10
  refresh-seconds: 60
  hologram:
    enabled: false
    world: world
    x: 0.0
    y: 64.0
    z: 0.0

audit:
  enabled: true
  max-entries: 5000
  # Optional HTTPS webhook for audit events. Leave blank to disable delivery.
  webhook-url: ''
  webhook-timeout-seconds: 5

worldguard:
  enabled: true

update-checker:
  enabled: false
  # Optional HTTPS URL that returns a version string or JSON object with a "version" field.
  url: ''

permissions:
  # Checked in descending order for lifesteal.maxhearts.<n>.
  max-hearts:
    - 20
    - 30
    - 40
    - 50
    - 100
