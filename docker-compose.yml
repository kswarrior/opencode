services:
  main:
    build:
      context: .
      dockerfile: ./main/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8080:8080"
    env_file:
      - path: ./.env
        required: false
      - path: ./main/.env
        required: false
    environment:
      - PORT=8080
      - AUTH_URL=${AUTH_URL:-http://auth:8081}
      - ACCOUNT_URL=${ACCOUNT_URL:-http://account:8082}
      - JWT_TOKEN=${JWT_TOKEN:-eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODk4NDM4MjAsImlkIjoiMDFhMGJiMDEtMjAxMC03ZjViLTg5NGQtZDI2ODhlOWEyMjkxIiwia2lkIjoiV1FhUGd1dExkUURFak9YMUpsUVNNSVZHbHBzUDNUdGUyb29SRGcweVBsRSIsInJpZCI6ImI0ZjI5YzlmLTdjZmYtNGZmZC1iODU0LTI5ZGM4NzE2NGY3MSJ9.JdIr0aaTLKrhw93KjVOKrs_f11_u87CKZq3TKuNE7TYPZCD8QqdlZOMUK-8GCfllIOWuNl4oBfyCrgUqsVgQAw}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'

  auth:
    build:
      context: .
      dockerfile: ./auth/Dockerfile
    restart: unless-stopped
    expose:
      - "8081"
    ports:
      - "8081:8081"
    env_file:
      - path: ./.env
        required: false
      - path: ./auth/.env
        required: false
    environment:
      - PORT=8081
      - JWT_TOKEN=${JWT_TOKEN:-eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODk4NDM4MjAsImlkIjoiMDFhMGJiMDEtMjAxMC03ZjViLTg5NGQtZDI2ODhlOWEyMjkxIiwia2lkIjoiV1FhUGd1dExkUURFak9YMUpsUVNNSVZHbHBzUDNUdGUyb29SRGcweVBsRSIsInJpZCI6ImI0ZjI5YzlmLTdjZmYtNGZmZC1iODU0LTI5ZGM4NzE2NGY3MSJ9.JdIr0aaTLKrhw93KjVOKrs_f11_u87CKZq3TKuNE7TYPZCD8QqdlZOMUK-8GCfllIOWuNl4oBfyCrgUqsVgQAw}
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-turso://account-kswarriorgh-th1.aws-ap-south-1.turso.io}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'

  account:
    build:
      context: .
      dockerfile: ./account/Dockerfile
    restart: unless-stopped
    expose:
      - "8082"
    ports:
      - "8082:8082"
    env_file:
      - path: ./.env
        required: false
      - path: ./account/.env
        required: false
    environment:
      - PORT=8082
      - AUTH_URL=${AUTH_URL:-http://auth:8081}
      - JWT_TOKEN=${JWT_TOKEN:-eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODk4NDM4MjAsImlkIjoiMDFhMGJiMDEtMjAxMC03ZjViLTg5NGQtZDI2ODhlOWEyMjkxIiwia2lkIjoiV1FhUGd1dExkUURFak9YMUpsUVNNSVZHbHBzUDNUdGUyb29SRGcweVBsRSIsInJpZCI6ImI0ZjI5YzlmLTdjZmYtNGZmZC1iODU0LTI5ZGM4NzE2NGY3MSJ9.JdIr0aaTLKrhw93KjVOKrs_f11_u87CKZq3TKuNE7TYPZCD8QqdlZOMUK-8GCfllIOWuNl4oBfyCrgUqsVgQAw}
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-turso://account-kswarriorgh-th1.aws-ap-south-1.turso.io}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'

  stats:
    build:
      context: .
      dockerfile: ./stats/Dockerfile
    restart: unless-stopped
    expose:
      - "8083"
    ports:
      - "8083:8083"
    env_file:
      - path: ./.env
        required: false
      - path: ./stats/.env
        required: false
    environment:
      - PORT=8083
      - MONITOR_INTERVAL=${MONITOR_INTERVAL:-30}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'

  browser:
    build:
      context: .
      dockerfile: ./browser/Dockerfile
    restart: unless-stopped
    expose:
      - "8084"
    ports:
      - "8084:8084"
    env_file:
      - path: ./.env
        required: false
      - path: ./browser/.env
        required: false
    environment:
      - PORT=8084
      - NODE_ENV=production
    shm_size: 2g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      main:
        condition: service_started
      auth:
        condition: service_started
      account:
        condition: service_started
      stats:
        condition: service_started
      browser:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'
