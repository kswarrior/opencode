services:
  main:
    build: ./main
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8080:8080"  # direct, also via gateway
    deploy:
      resources:
        limits:
          memory: 16M
          cpus: '0.5'

  auth:
    build: ./auth
    restart: unless-stopped
    expose:
      - "8081"
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 16M
          cpus: '0.5'

  account:
    build: ./account
    restart: unless-stopped
    expose:
      - "8082"
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits:
          memory: 16M
          cpus: '0.5'

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - main
      - auth
      - account
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.5'
