worker_processes auto;
events { worker_connections 4096; use epoll; multi_accept on; }
http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types { text/html html; text/css css; application/javascript js; }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream main_backend { server main:8080; }
    upstream auth_backend { server auth:8081; }
    upstream account_backend { server account:8082; }
    upstream stats_backend { server stats:8083; }
    upstream browser_backend { server browser:8084; }

    server {
        listen 80;
        # main
        location / {
            proxy_pass http://main_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        # auth — strip /auth prefix
        location /auth/ {
            proxy_pass http://auth_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /auth { return 302 /auth/; }

        # account
        location /account/ {
            proxy_pass http://account_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /account { return 302 /account/; }

        # stats — monitor dashboard
        location /stats/ {
            proxy_pass http://stats_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /stats { return 302 /stats/; }

        # browser — proxy only, phone executed (also handle direct /proxy for absolute rewrites)
        location /browser/ {
            proxy_pass http://browser_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            proxy_cache off;
            tcp_nodelay on;
        }
        location = /browser { return 302 /browser/; }
        # direct proxy path for absolute rewrites (e.g., https://host/proxy?url=...) -> browser
        location /proxy {
            proxy_pass http://browser_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            proxy_cache off;
            tcp_nodelay on;
        }
        location = /proxy.html { proxy_pass http://browser_backend/proxy.html; proxy_set_header Host $host; }

        # direct ws for browser (when not behind /browser prefix)
        location /ws {
            proxy_pass http://browser_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            proxy_cache off;
            tcp_nodelay on;
        }

        location /health { return 200 'gateway ok\n'; add_header Content-Type text/plain; }
    }
}
