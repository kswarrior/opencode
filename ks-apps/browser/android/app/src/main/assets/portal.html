<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="color-scheme" content="dark">
<title>KS Portal</title>
<style>
:root {
  color-scheme: dark;
  --bg: #070707;
  --text: #f5f5f5;
  --muted: #a3a3a3;
  --dim: #737373;
  --glass: rgba(255, 255, 255, .06);
  --glass-line: rgba(255, 255, 255, .14);
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(70% 50% at 50% -10%, rgba(210, 210, 210, .20), transparent 64%),
    radial-gradient(52% 42% at 102% 28%, rgba(155, 155, 155, .15), transparent 70%),
    radial-gradient(58% 44% at -2% 66%, rgba(125, 125, 125, .13), transparent 70%),
    radial-gradient(70% 48% at 50% 112%, rgba(105, 105, 105, .16), transparent 70%),
    linear-gradient(180deg, #171717 0%, #0a0a0a 50%, #050505 100%);
}
.orb {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.orb-a {
  top: 19%;
  left: -22%;
  width: 360px;
  height: 360px;
  background: radial-gradient(circle, rgba(190, 190, 190, .18), transparent 68%);
}
.orb-b {
  top: 33%;
  right: -28%;
  width: 460px;
  height: 460px;
  background: radial-gradient(circle, rgba(160, 160, 160, .16), transparent 70%);
}
.orb-c {
  bottom: -24%;
  left: 14%;
  width: 480px;
  height: 480px;
  background: radial-gradient(circle, rgba(120, 120, 120, .16), transparent 70%);
}
.beam {
  position: absolute;
  inset: -18% -30%;
  background: linear-gradient(116deg, transparent 34%, rgba(255, 255, 255, .055) 48%, transparent 62%);
  transform: rotate(4deg);
  pointer-events: none;
}
.bg::after {
  content: "";
  position: absolute;
  top: -22%;
  left: 50%;
  width: min(680px, 140vw);
  aspect-ratio: 1;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, .12), rgba(255, 255, 255, .03) 38%, transparent 68%);
}
.shell {
  position: relative;
  z-index: 1;
  width: min(940px, 100%);
  margin: 0 auto;
  padding: calc(14px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom));
}
.top-actions {
  position: absolute;
  top: calc(14px + env(safe-area-inset-top));
  right: 18px;
  z-index: 6;
  display: flex;
  gap: 8px;
}
.top-action {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  padding: 0;
  border: 1px solid var(--glass-line);
  border-radius: 13px;
  background: linear-gradient(135deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .035) 60%, rgba(255, 255, 255, .06));
  box-shadow: 0 12px 26px rgba(0, 0, 0, .32), inset 0 1px 0 rgba(255, 255, 255, .14);
  color: var(--text);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .2s var(--ease), border-color .2s ease, background .2s ease;
}
.top-action svg {
  width: 20px;
  height: 20px;
}
.top-action:hover, .top-action:focus-visible {
  border-color: rgba(255, 255, 255, .3);
  background: linear-gradient(135deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, .06) 60%, rgba(255, 255, 255, .09));
}
.top-action:active { transform: scale(.93); }
.brand {
  display: flex;
  justify-content: center;
  margin: 44px 0 28px;
}
.logo {
  width: clamp(132px, 38vw, 176px);
  aspect-ratio: 1;
  color: var(--text);
  animation: fadeIn .3s ease both;
}
.logo svg { display: block; width: 100%; height: 100%; }
.logo .logo-float { animation: logoFloat 8s ease-in-out infinite; }
.logo .logo-halo { animation: logoPulse 6.5s ease-in-out infinite; }
@media (min-width: 640px) {
  .brand { margin-top: 4px; }
}
.omni {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 6px 6px 15px;
  border: 1px solid var(--glass-line);
  border-radius: 15px;
  background: linear-gradient(135deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .04) 55%, rgba(255, 255, 255, .065));
  box-shadow: 0 22px 50px rgba(0, 0, 0, .48), inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 -1px 0 rgba(0, 0, 0, .35);
  overflow: hidden;
  isolation: isolate;
  transform: translateZ(0);
  transition: transform .3s var(--ease), border-color .25s ease, box-shadow .3s ease;
  animation: rise .55s .04s var(--ease) both;
}
.omni > * { position: relative; z-index: 1; }
.omni::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255, 255, 255, .14), transparent 46%);
  pointer-events: none;
}
.omni::after {
  content: "";
  position: absolute;
  top: -60%;
  bottom: -60%;
  left: 0;
  z-index: 0;
  width: 38%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .13), transparent);
  transform: translateX(-160%) skewX(-18deg);
  animation: sheen 8s ease-in-out infinite;
  pointer-events: none;
}
.omni:focus-within {
  transform: translateY(-1px) scale(1.005);
  border-color: rgba(255, 255, 255, .32);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .08), inset 0 1px 0 rgba(255, 255, 255, .2);
}
.omni > svg { flex: 0 0 auto; width: 20px; height: 20px; color: var(--muted); }
.omni input {
  flex: 1;
  min-width: 0;
  padding: 12px 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 16px;
  -webkit-appearance: none;
  appearance: none;
}
.omni input::placeholder { color: var(--dim); }
.omni button {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 46px;
  height: 42px;
  padding: 0;
  border: 0;
  border-radius: 11px;
  background: linear-gradient(180deg, #f7f7f7, #dedede);
  color: #0b0b0b;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .85);
  -webkit-tap-highlight-color: transparent;
  transition: transform .2s var(--ease), background .2s ease, box-shadow .2s ease;
}
.omni button svg {
  width: 19px;
  height: 19px;
  transform: rotate(45deg);
  transition: transform .25s var(--ease);
}
.omni button:hover { background: linear-gradient(180deg, #ffffff, #e9e9e9); }
.omni button:hover svg { transform: rotate(45deg) translateX(1px); }
.omni button:active { transform: scale(.93); box-shadow: 0 3px 10px rgba(0, 0, 0, .24); }
.section-label {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 26px 0 12px;
  color: rgba(245, 245, 245, .5);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .22em;
  animation: fadeUp .26s .04s ease both;
}
.section-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(255, 255, 255, .14), transparent);
}
.sites {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 4px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
  animation: fadeUp .3s .08s ease both;
}
.sites::-webkit-scrollbar { display: none; }
.favourites-label { animation-delay: .12s; }
.favourites-sites { animation-delay: .16s; }
.recents-label { animation-delay: .20s; }
.recents {
  display: flex;
  flex-direction: column;
  gap: 7px;
  max-height: calc(5 * 52px + 4 * 7px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-right: 2px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  animation: fadeUp .3s .24s ease both;
}
.recents::-webkit-scrollbar { display: none; }
.recent-row {
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 52px;
  padding: 4px 4px 4px 14px;
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 10px;
  background: linear-gradient(145deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .022));
  box-shadow: 0 10px 24px rgba(0, 0, 0, .24), inset 0 1px 0 rgba(255, 255, 255, .07);
  transition: background .18s ease, border-color .18s ease, transform .18s ease;
}
.recent-row:hover, .recent-row:focus-within {
  background: linear-gradient(145deg, rgba(255, 255, 255, .085), rgba(255, 255, 255, .035));
  border-color: rgba(255, 255, 255, .2);
}
.recent-main {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 10px 0;
  color: inherit;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.recent-main:active { transform: scale(.995); }
.recent-name {
  flex: 0 1 auto;
  max-width: 47%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 650;
}
.recent-sep {
  flex: 0 0 auto;
  color: rgba(255, 255, 255, .24);
  font-size: 12px;
}
.recent-url {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: 12px;
}
.recent-menu-btn {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s ease, color .15s ease;
}
.recent-menu-btn:hover, .recent-menu-btn:focus-visible, .recent-menu-btn[aria-expanded="true"] {
  background: rgba(255, 255, 255, .08);
  color: var(--text);
}
.recent-menu {
  position: fixed;
  z-index: 40;
  display: none;
  min-width: 206px;
  padding: 6px;
  border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 10px;
  background: linear-gradient(160deg, #242424, #121212);
  box-shadow: 0 20px 52px rgba(0, 0, 0, .62), inset 0 1px 0 rgba(255, 255, 255, .1);
}
.recent-menu.open {
  display: block;
  animation: fadeIn .14s ease both;
}
.recent-menu button {
  display: block;
  width: 100%;
  padding: 10px 11px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.recent-menu button:hover, .recent-menu button:focus-visible {
  background: rgba(255, 255, 255, .085);
  outline: 0;
}
.recent-menu button.danger { color: #ff9a9a; }
.recents-empty {
  margin: 0;
  padding: 15px 14px;
  border: 1px dashed rgba(255, 255, 255, .12);
  border-radius: 10px;
  background: rgba(255, 255, 255, .018);
  color: var(--dim);
  font-size: 12px;
}
.tile {
  flex: 0 0 84px;
  height: 116px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 8px;
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 10px;
  background: linear-gradient(145deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .03));
  box-shadow: 0 14px 32px rgba(0, 0, 0, .32), inset 0 1px 0 rgba(255, 255, 255, .1);
  color: inherit;
  font: inherit;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  scroll-snap-align: start;
  transition: background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
.tile:hover, .tile:focus-visible {
  background: linear-gradient(145deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .045));
  border-color: rgba(255, 255, 255, .26);
  transform: translateY(-2px);
  box-shadow: 0 18px 38px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .16);
}
.tile:active { transform: scale(.97); }
.tile-logo {
  position: relative;
  width: 60px;
  height: 60px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 8px;
  background: rgba(0, 0, 0, .22);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
  overflow: hidden;
}
.tile-logo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 10px;
}
.fallback {
  color: var(--text);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: .02em;
}
.tile-add {
  border-style: dashed;
  background: rgba(255, 255, 255, .02);
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}
.tile-add .add-logo {
  border-style: dashed;
  background: rgba(255, 255, 255, .015);
  box-shadow: none;
}
.add-plus {
  color: var(--muted);
  font-size: 30px;
  font-weight: 300;
  line-height: 1;
  transform: translateY(-1px);
}
.modal-scrim {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 18px calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
  background: rgba(0, 0, 0, .64);
}
.modal-scrim.open {
  display: flex;
  animation: fadeIn .18s ease both;
}
.modal-card {
  width: min(430px, 100%);
  margin: 0;
  padding: 18px;
  border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 14px;
  background: linear-gradient(160deg, #202020, #101010);
  box-shadow: 0 26px 70px rgba(0, 0, 0, .65), inset 0 1px 0 rgba(255, 255, 255, .12);
  animation: rise .24s cubic-bezier(.2, .8, .2, 1) both;
}
.modal-card h2 {
  margin: 0 0 14px;
  color: var(--text);
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -.01em;
}
.modal-field {
  display: block;
  margin-top: 10px;
}
.modal-field span {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.modal-field input {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 8px;
  outline: 0;
  background: rgba(255, 255, 255, .055);
  color: var(--text);
  font: inherit;
  font-size: 14px;
}
.modal-field input:focus {
  border-color: rgba(255, 255, 255, .32);
  background: rgba(255, 255, 255, .075);
}
.modal-field input::placeholder { color: var(--dim); }
.modal-copy {
  margin: 0 0 2px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}
.modal-error {
  min-height: 16px;
  margin: 8px 0 0;
  color: #ff9a9a;
  font-size: 12px;
}
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
.modal-btn {
  flex: 1;
  height: 42px;
  border: 0;
  border-radius: 8px;
  font: inherit;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.modal-btn.secondary {
  border: 1px solid rgba(255, 255, 255, .14);
  background: rgba(255, 255, 255, .06);
  color: var(--text);
}
.modal-btn.primary {
  background: #f2f2f2;
  color: #0b0b0b;
}
.modal-btn.primary.danger {
  background: #ff9a9a;
  color: #1b0505;
}
.modal-btn:active { transform: scale(.98); }
.tile-name {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 600;
}
body.launching .top-actions,
body.launching .brand,
body.launching .section-label,
body.launching .sites,
body.launching .recents {
  animation: none;
  opacity: 0;
  transition: opacity .24s ease;
  pointer-events: none;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes rise {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes sheen {
  0%, 62% { transform: translateX(-160%) skewX(-18deg); }
  100% { transform: translateX(420%) skewX(-18deg); }
}
@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
@keyframes logoPulse {
  0%, 100% { opacity: .72; }
  50% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><span class="orb orb-a"></span><span class="orb orb-b"></span><span class="orb orb-c"></span><span class="beam"></span></div>
<main class="shell">
  <header class="brand">
    <div class="logo" role="img" aria-label="KS">
      <svg viewBox="86 86 340 340" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="256" cy="256" r="152" stroke="currentColor" stroke-width="8" opacity=".9"/>
        <circle cx="256" cy="256" r="112" fill="rgba(255,255,255,.03)" stroke="currentColor" stroke-width="3"/>
        <ellipse cx="256" cy="256" rx="118" ry="42" stroke="currentColor" stroke-width="5" transform="rotate(-28 256 256)" opacity=".5"/>
        <ellipse cx="256" cy="256" rx="42" ry="118" stroke="currentColor" stroke-width="5" transform="rotate(-28 256 256)" opacity=".32"/>
        <circle cx="256" cy="256" r="4.5" fill="currentColor"/>
        <text x="256" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="102" letter-spacing="-5" fill="currentColor">KS</text>
      </svg>
    </div>
  </header>

  <form class="omni" id="omni" autocomplete="off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/>
      <path d="M20 20l-3.2-3.2" stroke-linecap="round"/>
    </svg>
    <input id="q" type="text" inputmode="url" placeholder="Search or enter address" aria-label="Search or enter address" spellcheck="false">
    <button type="submit" aria-label="Go">⌯✈︎</button>
  </form>

  <p class="section-label">TOP SITES</p>
  <nav class="sites" id="topSites" aria-label="Top sites">
    <a class="tile" href="https://www.google.com">
      <span class="tile-logo">
        <span class="fallback">G</span>
        <img src="https://www.google.com/s2/favicons?domain=google.com&amp;sz=64" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">
      </span>
      <span class="tile-name">Google</span>
    </a>
    <a class="tile" href="https://github.com">
      <span class="tile-logo">
        <span class="fallback">GH</span>
        <img src="https://github.com/fluidicon.png" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">
      </span>
      <span class="tile-name">GitHub</span>
    </a>
    <a class="tile" href="https://www.youtube.com">
      <span class="tile-logo">
        <span class="fallback">Y</span>
        <img src="https://www.google.com/s2/favicons?domain=youtube.com&amp;sz=64" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">
      </span>
      <span class="tile-name">YouTube</span>
    </a>
    <a class="tile" href="https://ksx.pages.dev">
      <span class="tile-logo">
        <span class="fallback">KS</span>
      </span>
      <span class="tile-name">KS Website</span>
    </a>
  </nav>

  <p class="section-label favourites-label">FAVOURITE SITES</p>
  <nav class="sites favourites-sites" id="favourites" aria-label="Favourite sites"></nav>

  <p class="section-label recents-label">RECENT SITES</p>
  <nav class="recents" id="recents" aria-label="Recent sites"></nav>
</main>

<div class="modal-scrim" id="favModal" aria-hidden="true">
  <form class="modal-card" id="favForm" role="dialog" aria-modal="true" aria-labelledby="favTitle">
    <h2 id="favTitle">Add favourite</h2>
    <div id="favFields">
      <label class="modal-field">
        <span>Name</span>
        <input id="favName" type="text" maxlength="40" placeholder="My site" autocomplete="off">
      </label>
      <label class="modal-field">
        <span>URL</span>
        <input id="favUrl" type="text" inputmode="url" placeholder="https://example.com" autocomplete="off" spellcheck="false">
      </label>
    </div>
    <p class="modal-copy" id="favCopy" hidden></p>
    <p class="modal-error" id="favError" role="alert"></p>
    <div class="modal-actions">
      <button class="modal-btn secondary" id="favCancel" type="button">Cancel</button>
      <button class="modal-btn primary" id="favSave" type="submit">Add</button>
    </div>
  </form>
</div>
<script>
(function () {
  var form = document.getElementById('omni');
  var input = document.getElementById('q');
  var launching = false;
  var FAV_KEY = 'ks_favourites_v1';
  var RECENTS_KEY = 'ks_recents_v1';
  var RECENTS_SHOW = 5;
  var RECENTS_STORE = 30;
  var favourites = loadFavourites();
  var favouritesNav = document.getElementById('favourites');
  var recentsNav = document.getElementById('recents');
  var nativePortal = window.KSPortalNative;
  var recents = [];
  var recentMenu = document.createElement('div');
  recentMenu.className = 'recent-menu';
  recentMenu.id = 'recentMenu';
  recentMenu.setAttribute('role', 'menu');
  document.body.appendChild(recentMenu);
  var activeRecentButton = null;
  var menuRecent = null;
  var modal = document.getElementById('favModal');
  var favForm = document.getElementById('favForm');
  var favTitle = document.getElementById('favTitle');
  var favFields = document.getElementById('favFields');
  var favCopy = document.getElementById('favCopy');
  var favName = document.getElementById('favName');
  var favUrl = document.getElementById('favUrl');
  var favError = document.getElementById('favError');
  var favSave = document.getElementById('favSave');
  var removeIndex = -1;
  var lastFocused = null;
  var suppressUntil = 0;

  function resolveUrl(raw) {
    var value = String(raw || '').trim();
    if (!value) return '';
    if (/^https?:\/\//i.test(value)) return value;
    if (/^[^\s/]+\.[^\s]{2,}(\/.*)?$/.test(value)) return 'https://' + value;
    return 'https://www.google.com/search?q=' + encodeURIComponent(value);
  }

  function launch(url) {
    if (launching || !url) return;
    launching = true;
    closeRecentMenu();
    if (!nativePortal) rememberRecent(url, hostFromUrl(url));
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) {
      window.location.href = url;
      return;
    }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    document.body.classList.add('launching');
    form.style.animation = 'none';
    form.style.transformOrigin = 'top left';
    var rect = form.getBoundingClientRect();
    var targetLeft = 56;
    var targetTop = 7;
    var viewportWidth = document.documentElement.clientWidth || window.innerWidth;
    var targetWidth = Math.max(120, viewportWidth - 112);
    var targetHeight = 42;
    var dx = targetLeft - rect.left;
    var dy = targetTop - rect.top;
    var sx = targetWidth / rect.width;
    var sy = targetHeight / rect.height;
    form.animate([
      {
        transform: 'translate(0, 0) scale(1, 1)',
        opacity: 1,
        borderRadius: '12px'
      },
      {
        transform: 'translate(' + (dx * .45) + 'px, ' + (dy * .55) + 'px) scale(' + (1 + (sx - 1) * .45) + ', ' + (1 + (sy - 1) * .55) + ')',
        opacity: .9,
        borderRadius: '8px',
        offset: .5
      },
      {
        transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + sx + ', ' + sy + ')',
        opacity: 0,
        borderRadius: '8px'
      }
    ], {
      duration: 340,
      easing: 'cubic-bezier(.22, .8, .22, 1)',
      fill: 'forwards'
    });
    setTimeout(function () {
      window.location.href = url;
    }, 360);
  }

  function loadFavourites() {
    try {
      var raw = window.localStorage.getItem(FAV_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(parsed)) return [];
      var result = [];
      for (var i = 0; i < parsed.length && result.length < 24; i++) {
        var item = parsed[i];
        if (!item || typeof item.name !== 'string' || typeof item.url !== 'string') continue;
        var url = normalizeFavouriteUrl(item.url);
        if (!url) continue;
        var name = item.name.trim().slice(0, 40);
        if (!name) name = new URL(url).hostname.replace(/^www\./, '');
        result.push({ name: name, url: url });
      }
      return result;
    } catch (error) {
      return [];
    }
  }

  function normalizeFavouriteUrl(raw) {
    var value = String(raw || '').trim();
    if (!value) return '';
    if (!/^https?:\/\//i.test(value)) value = 'https://' + value;
    try {
      var parsed = new URL(value);
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return '';
      if (!parsed.hostname || parsed.hostname.indexOf('.') === -1) return '';
      return parsed.href;
    } catch (error) {
      return '';
    }
  }

  function faviconUrl(url) {
    try {
      return 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(new URL(url).hostname) + '&sz=64';
    } catch (error) {
      return '';
    }
  }

  function initialFor(name) {
    var parts = String(name || '').trim().split(/\s+/);
    if (parts.length > 1 && parts[0] && parts[1]) {
      return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
    }
    return (String(name || '').trim().slice(0, 2) || '?').toUpperCase();
  }

  function saveFavourites() {
    try {
      window.localStorage.setItem(FAV_KEY, JSON.stringify(favourites));
    } catch (error) {}
  }

  function hostFromUrl(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, '');
    } catch (error) {
      return url;
    }
  }

  function sanitizeRecents(raw) {
    var result = [];
    if (!Array.isArray(raw)) return result;
    for (var i = 0; i < raw.length && result.length < RECENTS_STORE; i++) {
      var item = raw[i];
      if (!item || typeof item.name !== 'string' || typeof item.url !== 'string') continue;
      var url = normalizeFavouriteUrl(item.url);
      if (!url) continue;
      var duplicate = false;
      for (var j = 0; j < result.length; j++) {
        if (result[j].url === url) {
          duplicate = true;
          break;
        }
      }
      if (duplicate) continue;
      var name = item.name.replace(/\s+/g, ' ').trim().slice(0, 80);
      if (!name) name = hostFromUrl(url);
      result.push({ name: name, url: url });
    }
    return result;
  }

  function loadRecents() {
    var parsed = null;
    if (nativePortal && typeof nativePortal.getRecents === 'function') {
      try {
        var nativeRaw = nativePortal.getRecents();
        if (nativeRaw) parsed = JSON.parse(nativeRaw);
      } catch (error) {
        parsed = null;
      }
    }
    if (!Array.isArray(parsed)) {
      try {
        var raw = window.localStorage.getItem(RECENTS_KEY);
        parsed = raw ? JSON.parse(raw) : [];
      } catch (error) {
        parsed = [];
      }
    }
    return sanitizeRecents(parsed);
  }

  function saveFallbackRecents() {
    try {
      window.localStorage.setItem(RECENTS_KEY, JSON.stringify(recents.slice(0, RECENTS_STORE)));
    } catch (error) {}
  }

  function rememberRecent(url, title) {
    var clean = normalizeFavouriteUrl(url);
    if (!clean) return;
    var name = String(title || '').replace(/\s+/g, ' ').trim().slice(0, 80);
    if (!name) name = hostFromUrl(clean);
    var next = [{ name: name, url: clean }];
    for (var i = 0; i < recents.length && next.length < RECENTS_STORE; i++) {
      if (recents[i].url !== clean) next.push(recents[i]);
    }
    recents = next;
    saveFallbackRecents();
    renderRecents();
  }

  function removeRecent(url) {
    if (nativePortal && typeof nativePortal.removeRecent === 'function') {
      try {
        nativePortal.removeRecent(url);
      } catch (error) {}
    }
    var next = [];
    for (var i = 0; i < recents.length; i++) {
      if (recents[i].url !== url) next.push(recents[i]);
    }
    recents = next;
    saveFallbackRecents();
    renderRecents();
  }

  function favouriteIndexFor(url) {
    for (var i = 0; i < favourites.length; i++) {
      if (favourites[i].url === url) return i;
    }
    return -1;
  }

  function toggleRecentFavourite(item) {
    var index = favouriteIndexFor(item.url);
    if (index >= 0) {
      favourites.splice(index, 1);
    } else {
      favourites.push({ name: item.name.slice(0, 40) || hostFromUrl(item.url), url: item.url });
    }
    saveFavourites();
    renderFavourites();
  }

  function addRecentMenuAction(label, danger, action) {
    var button = document.createElement('button');
    button.type = 'button';
    button.setAttribute('role', 'menuitem');
    button.textContent = label;
    if (danger) button.className = 'danger';
    button.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();
      closeRecentMenu();
      action();
    });
    recentMenu.appendChild(button);
  }

  function openRecentMenu(anchor, item) {
    closeRecentMenu();
    menuRecent = item;
    activeRecentButton = anchor;
    anchor.setAttribute('aria-expanded', 'true');
    recentMenu.textContent = '';
    var isFavourite = favouriteIndexFor(item.url) >= 0;
    addRecentMenuAction(isFavourite ? 'Remove from favourites' : 'Add to favourites', false, function () {
      toggleRecentFavourite(item);
    });
    addRecentMenuAction('Remove from recents', true, function () {
      removeRecent(item.url);
    });
    recentMenu.classList.add('open');
    var rect = anchor.getBoundingClientRect();
    var width = recentMenu.offsetWidth;
    var height = recentMenu.offsetHeight;
    var left = Math.max(8, Math.min(rect.right - width, window.innerWidth - width - 8));
    var top = rect.bottom + 6;
    if (top + height > window.innerHeight - 8) {
      top = Math.max(8, rect.top - height - 6);
    }
    recentMenu.style.left = left + 'px';
    recentMenu.style.top = top + 'px';
  }

  function closeRecentMenu() {
    if (!recentMenu.classList.contains('open')) return;
    recentMenu.classList.remove('open');
    recentMenu.style.left = '';
    recentMenu.style.top = '';
    recentMenu.textContent = '';
    if (activeRecentButton) {
      activeRecentButton.setAttribute('aria-expanded', 'false');
      activeRecentButton = null;
    }
    menuRecent = null;
  }

  function makeRecentRow(item) {
    var row = document.createElement('div');
    row.className = 'recent-row';

    var link = document.createElement('a');
    link.className = 'recent-main';
    link.href = item.url;
    link.title = item.name + ' | ' + item.url;
    var name = document.createElement('span');
    name.className = 'recent-name';
    name.textContent = item.name;
    var separator = document.createElement('span');
    separator.className = 'recent-sep';
    separator.textContent = '|';
    var url = document.createElement('span');
    url.className = 'recent-url';
    url.textContent = item.url;
    link.appendChild(name);
    link.appendChild(separator);
    link.appendChild(url);
    link.addEventListener('click', function (event) {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      launch(item.url);
    });

    var menuButton = document.createElement('button');
    menuButton.type = 'button';
    menuButton.className = 'recent-menu-btn';
    menuButton.textContent = '⋮';
    menuButton.setAttribute('aria-label', 'Options for ' + item.name);
    menuButton.setAttribute('aria-haspopup', 'menu');
    menuButton.setAttribute('aria-expanded', 'false');
    menuButton.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();
      if (menuButton.getAttribute('aria-expanded') === 'true') {
        closeRecentMenu();
      } else {
        openRecentMenu(menuButton, item);
      }
    });

    row.appendChild(link);
    row.appendChild(menuButton);
    return row;
  }

  function renderRecents() {
    recentsNav.textContent = '';
    if (!recents.length) {
      var empty = document.createElement('p');
      empty.className = 'recents-empty';
      empty.textContent = 'Sites you visit will appear here.';
      recentsNav.appendChild(empty);
      return;
    }
    for (var i = 0; i < recents.length && i < RECENTS_SHOW; i++) {
      recentsNav.appendChild(makeRecentRow(recents[i]));
    }
  }

  function refreshRecents() {
    recents = loadRecents();
    renderRecents();
  }

  function makeFavouriteTile(favourite, index) {
    var tile = document.createElement('a');
    tile.className = 'tile';
    tile.href = favourite.url;

    var logo = document.createElement('span');
    logo.className = 'tile-logo';
    var fallback = document.createElement('span');
    fallback.className = 'fallback';
    fallback.textContent = initialFor(favourite.name);
    logo.appendChild(fallback);
    var favicon = document.createElement('img');
    favicon.alt = '';
    favicon.setAttribute('loading', 'lazy');
    favicon.setAttribute('referrerpolicy', 'no-referrer');
    var icon = faviconUrl(favourite.url);
    if (icon) favicon.src = icon;
    favicon.onerror = function () { favicon.remove(); };
    logo.appendChild(favicon);

    var name = document.createElement('span');
    name.className = 'tile-name';
    name.textContent = favourite.name;
    tile.appendChild(logo);
    tile.appendChild(name);

    tile.addEventListener('click', function (event) {
      if (Date.now() < suppressUntil) {
        event.preventDefault();
        return;
      }
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      launch(favourite.url);
    });
    bindFavouriteLongPress(tile, favourite, index);
    return tile;
  }

  function bindFavouriteLongPress(tile, favourite, index) {
    var timer = 0;
    function cancel() {
      if (timer) {
        window.clearTimeout(timer);
        timer = 0;
      }
    }
    function start(event) {
      if (event.type === 'mousedown' && event.button !== 0) return;
      cancel();
      timer = window.setTimeout(function () {
        timer = 0;
        suppressUntil = Date.now() + 800;
        openRemoveModal(favourite, index);
      }, 520);
    }
    tile.addEventListener('touchstart', start, { passive: true });
    tile.addEventListener('touchend', cancel);
    tile.addEventListener('touchcancel', cancel);
    tile.addEventListener('touchmove', cancel, { passive: true });
    tile.addEventListener('mousedown', start);
    tile.addEventListener('mouseup', cancel);
    tile.addEventListener('mouseleave', cancel);
    tile.addEventListener('contextmenu', function (event) {
      event.preventDefault();
      cancel();
      suppressUntil = Date.now() + 800;
      openRemoveModal(favourite, index);
    });
  }

  function makeAddTile() {
    var tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile tile-add';
    tile.setAttribute('aria-label', 'Add favourite');
    var logo = document.createElement('span');
    logo.className = 'tile-logo add-logo';
    var plus = document.createElement('span');
    plus.className = 'add-plus';
    plus.textContent = '+';
    logo.appendChild(plus);
    var name = document.createElement('span');
    name.className = 'tile-name';
    name.textContent = 'Add';
    tile.appendChild(logo);
    tile.appendChild(name);
    tile.addEventListener('click', openAddModal);
    return tile;
  }

  function renderFavourites() {
    favouritesNav.textContent = '';
    for (var i = 0; i < favourites.length; i++) {
      favouritesNav.appendChild(makeFavouriteTile(favourites[i], i));
    }
    favouritesNav.appendChild(makeAddTile());
  }

  function openAddModal() {
    removeIndex = -1;
    favTitle.textContent = 'Add favourite';
    favFields.hidden = false;
    favCopy.hidden = true;
    favCopy.textContent = '';
    favName.value = '';
    favUrl.value = '';
    favError.textContent = '';
    favSave.textContent = 'Add';
    favSave.classList.remove('danger');
    openModal();
    window.setTimeout(function () { favName.focus(); }, 30);
  }

  function openRemoveModal(favourite, index) {
    if (modal.classList.contains('open') && removeIndex === index) return;
    removeIndex = index;
    favTitle.textContent = 'Remove favourite?';
    favFields.hidden = true;
    favCopy.hidden = false;
    favCopy.textContent = 'Remove "' + favourite.name + '" from your favourites?';
    favError.textContent = '';
    favSave.textContent = 'Remove';
    favSave.classList.add('danger');
    openModal();
    window.setTimeout(function () { favSave.focus(); }, 30);
  }

  function openModal() {
    lastFocused = document.activeElement;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    removeIndex = -1;
    if (lastFocused && lastFocused.focus) {
      try { lastFocused.focus(); } catch (error) {}
    }
  }

  favForm.addEventListener('submit', function (event) {
    event.preventDefault();
    if (removeIndex >= 0) {
      favourites.splice(removeIndex, 1);
      saveFavourites();
      closeModal();
      renderFavourites();
      return;
    }
    var url = normalizeFavouriteUrl(favUrl.value);
    if (!url) {
      favError.textContent = 'Enter a valid website address.';
      favUrl.focus();
      return;
    }
    var name = favName.value.trim().slice(0, 40);
    if (!name) name = new URL(url).hostname.replace(/^www\./, '');
    for (var i = 0; i < favourites.length; i++) {
      if (favourites[i].url === url) {
        favError.textContent = 'This site is already in favourites.';
        return;
      }
    }
    favourites.push({ name: name, url: url });
    saveFavourites();
    closeModal();
    renderFavourites();
  });

  document.getElementById('favCancel').addEventListener('click', closeModal);
  modal.addEventListener('click', function (event) {
    if (event.target === modal) closeModal();
  });
  document.addEventListener('click', function (event) {
    if (!recentMenu.classList.contains('open')) return;
    if (recentMenu.contains(event.target)) return;
    closeRecentMenu();
  });
  window.addEventListener('resize', closeRecentMenu);
  window.addEventListener('scroll', closeRecentMenu, true);
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;
    if (recentMenu.classList.contains('open')) {
      closeRecentMenu();
      return;
    }
    if (modal.classList.contains('open')) closeModal();
  });

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    launch(resolveUrl(input.value));
  });

  var tiles = document.querySelectorAll('#topSites .tile');
  for (var i = 0; i < tiles.length; i++) {
    tiles[i].addEventListener('click', function (event) {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      launch(this.href);
    });
  }

  renderFavourites();
  refreshRecents();

  window.addEventListener('pageshow', function () {
    refreshRecents();
    if (!launching) return;
    launching = false;
    document.body.classList.remove('launching');
    form.style.transformOrigin = '';
    if (form.getAnimations) {
      var running = form.getAnimations();
      for (var j = 0; j < running.length; j++) running[j].cancel();
    }
  });
})();
</script>
</body>
</html>
