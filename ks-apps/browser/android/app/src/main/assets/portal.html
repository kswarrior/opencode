<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="color-scheme" content="dark">
<title>KS Portal</title>
<style>
:root {
  color-scheme: dark;
  --bg: #070707;
  --text: #f5f5f5;
  --muted: #a3a3a3;
  --dim: #737373;
  --glass: rgba(255, 255, 255, .06);
  --glass-line: rgba(255, 255, 255, .14);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --tile-width: 84px;
  --tile-height: 100px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(70% 50% at 50% -10%, rgba(210, 210, 210, .20), transparent 64%),
    radial-gradient(52% 42% at 102% 28%, rgba(155, 155, 155, .15), transparent 70%),
    radial-gradient(58% 44% at -2% 66%, rgba(125, 125, 125, .13), transparent 70%),
    radial-gradient(70% 48% at 50% 112%, rgba(105, 105, 105, .16), transparent 70%),
    linear-gradient(180deg, #171717 0%, #0a0a0a 50%, #050505 100%);
}
.orb {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.orb-a {
  top: 19%;
  left: -22%;
  width: 360px;
  height: 360px;
  background: radial-gradient(circle, rgba(190, 190, 190, .18), transparent 68%);
}
.orb-b {
  top: 33%;
  right: -28%;
  width: 460px;
  height: 460px;
  background: radial-gradient(circle, rgba(160, 160, 160, .16), transparent 70%);
}
.orb-c {
  bottom: -24%;
  left: 14%;
  width: 480px;
  height: 480px;
  background: radial-gradient(circle, rgba(120, 120, 120, .16), transparent 70%);
}
.beam {
  position: absolute;
  inset: -18% -30%;
  background: linear-gradient(116deg, transparent 34%, rgba(255, 255, 255, .055) 48%, transparent 62%);
  transform: rotate(4deg);
  pointer-events: none;
}
body.has-background .orb,
body.has-background .beam,
body.has-background .bg::after {
  display: none;
}
.bg::after {
  content: "";
  position: absolute;
  top: -22%;
  left: 50%;
  width: min(680px, 140vw);
  aspect-ratio: 1;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, .12), rgba(255, 255, 255, .03) 38%, transparent 68%);
}
.shell {
  position: relative;
  z-index: 1;
  width: min(940px, 100%);
  margin: 0 auto;
  padding: calc(14px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom));
}
.top-actions {
  position: absolute;
  top: calc(14px + env(safe-area-inset-top));
  right: 18px;
  z-index: 6;
  display: flex;
  gap: 8px;
}
.top-action {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  font-size: 14px;
  font-weight: 700;
  padding: 0;
  border: 1px solid var(--glass-line);
  border-radius: 13px;
  background: linear-gradient(135deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .035) 60%, rgba(255, 255, 255, .06));
  box-shadow: 0 12px 26px rgba(0, 0, 0, .32), inset 0 1px 0 rgba(255, 255, 255, .14);
  color: var(--text);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .2s var(--ease), border-color .2s ease, background .2s ease;
}
.top-action svg {
  width: 20px;
  height: 20px;
}
.top-action:hover, .top-action:focus-visible {
  border-color: rgba(255, 255, 255, .3);
  background: linear-gradient(135deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, .06) 60%, rgba(255, 255, 255, .09));
}
.top-action:active { transform: scale(.93); }
.wordmark {
  position: absolute;
  top: calc(14px + env(safe-area-inset-top));
  left: 18px;
  z-index: 6;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  height: 42px;
  pointer-events: none;
  animation: fadeUp .34s .02s var(--ease) both;
}
.wordmark-title {
  font-size: clamp(15px, 4.3vw, 18px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.02em;
  white-space: nowrap;
  color: #f5f5f5;
  background: linear-gradient(180deg, #ffffff 25%, #d6d6d6 62%, #9c9c9c);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.wordmark-sub {
  font-size: 9px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: .18em;
  white-space: nowrap;
  color: var(--muted);
}
.brand {
  display: flex;
  justify-content: center;
  margin: 44px 0 28px;
}
.logo {
  width: clamp(132px, 38vw, 176px);
  aspect-ratio: 1;
  color: var(--text);
  transform: translateZ(0);
  animation: fadeIn .3s ease both, logoFloat 8s 4s ease-in-out infinite;
}
.logo svg { display: block; width: 100%; height: 100%; }
@media (min-width: 640px) {
  .brand { margin-top: 4px; }
}
.omni {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 6px 6px 15px;
  border: 1px solid var(--glass-line);
  border-radius: 15px;
  background: linear-gradient(135deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .04) 55%, rgba(255, 255, 255, .065));
  box-shadow: 0 22px 50px rgba(0, 0, 0, .48), inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 -1px 0 rgba(0, 0, 0, .35);
  overflow: hidden;
  isolation: isolate;
  transform: translateZ(0);
  transition: transform .3s var(--ease), border-color .25s ease, box-shadow .3s ease;
  animation: rise .55s .04s var(--ease) both;
}
.omni > * { position: relative; z-index: 1; }
.omni::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255, 255, 255, .14), transparent 46%);
  pointer-events: none;
}
.omni::after {
  content: "";
  position: absolute;
  top: -60%;
  bottom: -60%;
  left: 0;
  z-index: 0;
  width: 38%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .13), transparent);
  transform: translateX(-160%) skewX(-18deg);
  animation: sheen 8s ease-in-out infinite;
  pointer-events: none;
}
.omni:focus-within {
  transform: translateY(-1px) scale(1.005);
  border-color: rgba(255, 255, 255, .32);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .08), inset 0 1px 0 rgba(255, 255, 255, .2);
}
.omni > svg { flex: 0 0 auto; width: 20px; height: 20px; color: var(--muted); }
.omni input {
  flex: 1;
  min-width: 0;
  padding: 12px 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 16px;
  -webkit-appearance: none;
  appearance: none;
}
.omni input::placeholder { color: var(--dim); }
.omni button {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 46px;
  height: 42px;
  padding: 0;
  border: 0;
  border-radius: 11px;
  background: linear-gradient(180deg, #f7f7f7, #dedede);
  color: #0b0b0b;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .85);
  -webkit-tap-highlight-color: transparent;
  transition: transform .2s var(--ease), background .2s ease, box-shadow .2s ease;
}
.omni button .go-plane {
  display: block;
  font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", sans-serif;
  font-size: 20px;
  line-height: 1;
  transform: translateX(1px);
  transition: transform .25s var(--ease);
}
.omni button:hover { background: linear-gradient(180deg, #ffffff, #e9e9e9); }
.omni button:hover .go-plane { transform: translateX(2px) translateY(-1px); }
.omni button:active { transform: scale(.93); box-shadow: 0 3px 10px rgba(0, 0, 0, .24); }
.mode-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 10px;
  animation: rise .55s .1s var(--ease) both;
}
.mode-chip {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 46px;
  padding: 0 14px;
  border: 1px solid var(--glass-line);
  border-radius: 15px;
  background: linear-gradient(135deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .035) 55%, rgba(255, 255, 255, .06));
  box-shadow: 0 14px 32px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255, 255, 255, .12), inset 0 -1px 0 rgba(0, 0, 0, .28);
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  font-weight: 650;
  letter-spacing: .01em;
  cursor: pointer;
  overflow: hidden;
  isolation: isolate;
  -webkit-tap-highlight-color: transparent;
  transition: transform .2s var(--ease), border-color .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
}
.mode-chip::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255, 255, 255, .1), transparent 52%);
  pointer-events: none;
}
.mode-chip > * { position: relative; z-index: 1; }
.mode-chip:hover, .mode-chip:focus-visible {
  border-color: rgba(255, 255, 255, .28);
  color: var(--text);
  background: linear-gradient(135deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .05) 55%, rgba(255, 255, 255, .09));
}
.mode-chip:focus-visible {
  outline: 2px solid rgba(255, 255, 255, .55);
  outline-offset: 2px;
}
.mode-chip:active { transform: scale(.975); }
.mode-chip.active {
  color: var(--text);
  border-color: rgba(255, 255, 255, .34);
  background: linear-gradient(135deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, .07) 55%, rgba(255, 255, 255, .13));
  box-shadow: 0 18px 38px rgba(0, 0, 0, .46), 0 0 0 1px rgba(255, 255, 255, .06), inset 0 1px 0 rgba(255, 255, 255, .24);
}
.mode-chip .mode-icon {
  display: grid;
  place-items: center;
  width: 25px;
  height: 25px;
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 9px;
  background: rgba(255, 255, 255, .06);
  color: var(--muted);
  transition: background .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease;
}
.mode-chip .mode-icon svg { width: 16px; height: 16px; }
.mode-chip.active .mode-icon {
  border-color: rgba(255, 255, 255, .18);
  background: rgba(255, 255, 255, .16);
  color: #ffffff;
  box-shadow: 0 0 18px rgba(255, 255, 255, .12);
}
.section-label {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 26px 0 12px;
  color: rgba(245, 245, 245, .5);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .22em;
  animation: fadeUp .26s .04s ease both;
}
.section-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(255, 255, 255, .14), transparent);
}
.top-sites-label { margin-bottom: 4px; }
.section-history {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 1px solid rgba(255, 255, 255, .15);
  border-radius: 9px;
  background: linear-gradient(145deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .03));
  box-shadow: 0 8px 18px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .12);
  color: var(--muted);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .2s var(--ease), border-color .2s ease, color .2s ease, background .2s ease;
}
.section-history svg { width: 15px; height: 15px; }
.section-history:hover, .section-history:focus-visible {
  border-color: rgba(255, 255, 255, .32);
  background: linear-gradient(145deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .055));
  color: var(--text);
}
.section-history:active { transform: scale(.9); }
.sites {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 4px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
  animation: fadeUp .3s .08s ease both;
}
.sites::-webkit-scrollbar { display: none; }
.bookmarks-label { animation-delay: .12s; margin-top: 16px; margin-bottom: 4px; }
.bookmarks-sites { animation-delay: .16s; }
.recents-label { animation-delay: .20s; margin-top: 16px; }
.recents {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding-right: 2px;
  touch-action: pan-y;
  animation: fadeUp .3s .24s ease both;
}
.recent-row {
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 52px;
  padding: 4px 4px 4px 14px;
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 10px;
  background: linear-gradient(145deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .022));
  box-shadow: 0 10px 24px rgba(0, 0, 0, .24), inset 0 1px 0 rgba(255, 255, 255, .07);
  transition: background .18s ease, border-color .18s ease, transform .18s ease;
}
.recent-row:hover, .recent-row:focus-within {
  background: linear-gradient(145deg, rgba(255, 255, 255, .085), rgba(255, 255, 255, .035));
  border-color: rgba(255, 255, 255, .2);
}
.recent-main {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 10px 0;
  color: inherit;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.recent-main:active { transform: scale(.995); }
.recent-name {
  flex: 0 1 auto;
  max-width: 47%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 650;
}
.recent-sep {
  flex: 0 0 auto;
  color: rgba(255, 255, 255, .24);
  font-size: 12px;
}
.recent-url {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: 12px;
}
.recent-menu-btn {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s ease, color .15s ease;
}
.recent-menu-btn:hover, .recent-menu-btn:focus-visible, .recent-menu-btn[aria-expanded="true"] {
  background: rgba(255, 255, 255, .08);
  color: var(--text);
}
.recent-menu {
  position: fixed;
  z-index: 40;
  display: none;
  min-width: 206px;
  padding: 6px;
  border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 10px;
  background: linear-gradient(160deg, #242424, #121212);
  box-shadow: 0 20px 52px rgba(0, 0, 0, .62), inset 0 1px 0 rgba(255, 255, 255, .1);
}
.recent-menu.open {
  display: block;
  animation: fadeIn .14s ease both;
}
.recent-menu button {
  display: block;
  width: 100%;
  padding: 10px 11px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.recent-menu button:hover, .recent-menu button:focus-visible {
  background: rgba(255, 255, 255, .085);
  outline: 0;
}
.recent-menu button.danger { color: #ff9a9a; }
.recents-empty {
  margin: 0;
  padding: 15px 14px;
  border: 1px dashed rgba(255, 255, 255, .12);
  border-radius: 10px;
  background: rgba(255, 255, 255, .018);
  color: var(--dim);
  font-size: 12px;
}
.tile {
  flex: 0 0 var(--tile-width);
  width: var(--tile-width);
  min-width: var(--tile-width);
  max-width: var(--tile-width);
  height: var(--tile-height);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0;
  border: 0;
  background: none;
  box-shadow: none;
  color: inherit;
  font: inherit;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  scroll-snap-align: start;
  transition: transform .18s ease;
}
.tile:hover, .tile:focus-visible { transform: translateY(-2px); }
.tile:hover .tile-logo, .tile:focus-visible .tile-logo {
  border-color: rgba(255, 255, 255, .26);
  background: rgba(0, 0, 0, .32);
}
.tile:active { transform: scale(.97); }
.tile-logo {
  position: relative;
  width: 60px;
  height: 60px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 8px;
  background: rgba(0, 0, 0, .22);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
  overflow: hidden;
}
.tile-logo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 10px;
}
.fallback {
  color: var(--text);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: .02em;
}
.tile-add {
  background: none;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}
.tile-add .add-logo {
  border-style: dashed;
  background: rgba(255, 255, 255, .015);
  box-shadow: none;
}
.add-plus {
  color: var(--muted);
  font-size: 30px;
  font-weight: 300;
  line-height: 1;
  transform: translateY(-1px);
}
.modal-scrim {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 18px calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
  background: rgba(0, 0, 0, .64);
}
.modal-scrim.open {
  display: flex;
  animation: fadeIn .18s ease both;
}
.modal-card {
  width: min(430px, 100%);
  margin: 0;
  padding: 18px;
  border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 14px;
  background: linear-gradient(160deg, #202020, #101010);
  box-shadow: 0 26px 70px rgba(0, 0, 0, .65), inset 0 1px 0 rgba(255, 255, 255, .12);
  animation: rise .24s cubic-bezier(.2, .8, .2, 1) both;
}
.modal-card h2 {
  margin: 0 0 14px;
  color: var(--text);
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -.01em;
}
.modal-field {
  display: block;
  margin-top: 10px;
}
.modal-field span {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.modal-field input {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 8px;
  outline: 0;
  background: rgba(255, 255, 255, .055);
  color: var(--text);
  font: inherit;
  font-size: 14px;
}
.modal-field input:focus {
  border-color: rgba(255, 255, 255, .32);
  background: rgba(255, 255, 255, .075);
}
.modal-field input::placeholder { color: var(--dim); }
.modal-copy {
  margin: 0 0 2px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}
.modal-error {
  min-height: 16px;
  margin: 8px 0 0;
  color: #ff9a9a;
  font-size: 12px;
}
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
.modal-btn {
  flex: 1;
  height: 42px;
  border: 0;
  border-radius: 8px;
  font: inherit;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.modal-btn.secondary {
  border: 1px solid rgba(255, 255, 255, .14);
  background: rgba(255, 255, 255, .06);
  color: var(--text);
}
.modal-btn.primary {
  background: #f2f2f2;
  color: #0b0b0b;
}
.modal-btn.primary.danger {
  background: #ff9a9a;
  color: #1b0505;
}
.modal-btn:active { transform: scale(.98); }
.tile-name {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 600;
}
body.launching .top-actions,
body.launching .wordmark,
body.launching .brand,
body.launching .mode-row,
body.launching .section-label,
body.launching .sites,
body.launching .recents {
  animation: none;
  opacity: 0;
  transition: opacity .24s ease;
  pointer-events: none;

  to { opacity: 1; transform: translateY(0); }
}

    tile.addEventListener('touchend', cancel);
    tile.addEventListener('touchcancel', cancel);
    tile.addEventListener('touchmove', cancel, { passive: true });
    tile.addEventListener('mousedown', start);
    tile.addEventListener('mouseup', cancel);
    tile.addEventListener('mouseleave', cancel);

  }

  function makeAddTile() {
    var tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile tile-add';
    tile.setAttribute('aria-label', t('addTile'));
    var logo = document.createElement('span');
    logo.className = 'tile-logo add-logo';
    var plus = document.createElement('span');
    plus.className = 'add-plus';
    plus.textContent = '+';
    logo.appendChild(plus);
    var name = document.createElement('span');
    name.className = 'tile-name';
    name.textContent = 'Add';
    tile.appendChild(logo);
    tile.appendChild(name);
    tile.addEventListener('click', openAddModal);
    return tile;
  }

  function renderBookmarks() {
    bookmarksNav.textContent = '';
    for (var i = 0; i < bookmarks.length; i++) {
      bookmarksNav.appendChild(makeBookmarkTile(bookmarks[i], i));
    }
    bookmarksNav.appendChild(makeAddTile());
  }

  function refreshBookmarks() {
    bookmarks = loadBookmarks();
    renderBookmarks();
  }
  window.KSPortalRefreshBookmarks = refreshBookmarks;

  function openAddModal() {
    removeIndex = -1;
    bookmarkTitle.textContent = t('addBookmark');
    bookmarkFields.hidden = false;
    bookmarkCopy.hidden = true;
    bookmarkCopy.textContent = '';
    bookmarkName.value = '';
    bookmarkUrl.value = '';
    bookmarkError.textContent = '';
    bookmarkSave.textContent = t('add');
    bookmarkSave.classList.remove('danger');
    openModal();
    window.setTimeout(function () { bookmarkName.focus(); }, 30);
  }

  function openRemoveModal(bookmark, index) {
    if (modal.classList.contains('open') && removeIndex === index) return;
    removeIndex = index;
    bookmarkTitle.textContent = t('removeBookmark');
    bookmarkFields.hidden = true;
    bookmarkCopy.hidden = false;
    bookmarkCopy.textContent = formatText('removeMessage', bookmark.name);
    bookmarkError.textContent = '';
    bookmarkSave.textContent = t('remove');
    bookmarkSave.classList.add('danger');
    openModal();
    window.setTimeout(function () { bookmarkSave.focus(); }, 30);
  }

  function openModal() {
    lastFocused = document.activeElement;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    removeIndex = -1;
    if (lastFocused && lastFocused.focus) {
      try { lastFocused.focus(); } catch (error) {}
    }
  }

  bookmarkForm.addEventListener('submit', function (event) {
    event.preventDefault();
    if (removeIndex >= 0) {
      bookmarks.splice(removeIndex, 1);
      saveBookmarks();
      closeModal();
      renderBookmarks();
      return;
    }
    var url = normalizeBookmarkUrl(bookmarkUrl.value);
    if (!url) {
      bookmarkError.textContent = t('invalidUrl');
      bookmarkUrl.focus();
      return;
    }
    var name = bookmarkName.value.trim().slice(0, 40);
    if (!name) name = new URL(url).hostname.replace(/^www\./, '');
    for (var i = 0; i < bookmarks.length; i++) {
      if (bookmarks[i].url === url) {
        bookmarkError.textContent = t('duplicate');
        return;
      }
    }
    bookmarks.push({ name: name, url: url });
    saveBookmarks();
    closeModal();
    renderBookmarks();
  });

  document.getElementById('bookmarkCancel').addEventListener('click', closeModal);
  modal.addEventListener('click', function (event) {
    if (event.target === modal) closeModal();
  });
  document.addEventListener('click', function (event) {
    if (!recentMenu.classList.contains('open')) return;
    if (recentMenu.contains(event.target)) return;
    closeRecentMenu();
  });
  window.addEventListener('resize', closeRecentMenu);
  window.addEventListener('scroll', closeRecentMenu, true);
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;
    if (recentMenu.classList.contains('open')) {
      closeRecentMenu();
      return;
    }
    if (modal.classList.contains('open')) closeModal();
  });

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    launch(resolveUrl(input.value));
  });

  aiButton.addEventListener('click', function (event) {
    event.preventDefault();
    aiMode = !aiMode;
    updateModeUi();
    input.focus();
  });

  incognitoButton.addEventListener('click', function (event) {
    event.preventDefault();
    incognito = !incognito;
    syncPrivateMode(incognito);
    updateModeUi();
    input.focus();
  });

  function invokeNative(action) {
    if (!nativePortal || typeof nativePortal[action] !== 'function') return;
    try {
      nativePortal[action]();
    } catch (error) {}
  }

  function refreshTabsCount() {
    var badge = document.getElementById('tabsCount');
    if (!badge || !nativePortal || typeof nativePortal.getTabCount !== 'function') return;
    try {
      var count = nativePortal.getTabCount();
      if (typeof count === 'number' && count > 0) {
        badge.textContent = count > 99 ? '99+' : String(count);
      }
    } catch (error) {}
  }
  window.KSPortalRefreshTabs = refreshTabsCount;
  refreshTabsCount();

  document.getElementById('btnTabs').addEventListener('click', function (event) {
    event.preventDefault();
    invokeNative('openTabs');
  });
  document.getElementById('btnHistory').addEventListener('click', function (event) {
    event.preventDefault();
    invokeNative('openHistory');
  });
  document.getElementById('btnCustomize').addEventListener('click', function (event) {
    event.preventDefault();
    invokeNative('openCustomize');
  });
  document.getElementById('btnDownloads').addEventListener('click', function (event) {
    event.preventDefault();
    invokeNative('openDownloads');
  });
  document.getElementById('btnSettings').addEventListener('click', function (event) {
    event.preventDefault();
    invokeNative('openSettings');
  });

  var tiles = document.querySelectorAll('#topSites .tile');
  for (var i = 0; i < tiles.length; i++) {
    tiles[i].addEventListener('click', function (event) {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      launch(this.href);
    });
  }

  applyPortalStrings();
  applyHomeLayout();
  renderBookmarks();
  refreshRecents();
  applyBackground();
  restoreModes();
  updateModeUi();

  window.addEventListener('pageshow', function () {
    refreshRecents();
    applyBackground();
    if (!launching) return;
    launching = false;
    document.body.classList.remove('launching');
    form.style.transformOrigin = '';
    form.style.willChange = '';
    if (form.getAnimations) {
      var running = form.getAnimations();
      for (var j = 0; j < running.length; j++) running[j].cancel();
    }
  });
})();
</script>
</body>
</html>
