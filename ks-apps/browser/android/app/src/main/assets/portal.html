<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262626">
<meta name="color-scheme" content="dark">
<title>KS Portal</title>
<style>
:root {
  color-scheme: dark;
  --bg: #262626;
  --panel: #0b0b0b;
  --panel-2: #141414;
  --border: #4a4a4a;
  --text: #f5f5f5;
  --muted: #a3a3a3;
  --dim: #737373;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.shell {
  width: min(940px, 100%);
  margin: 0 auto;
  padding: calc(22px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));
}
.omni {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 6px 6px 14px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--panel);
}
.omni > svg { flex: 0 0 auto; width: 19px; height: 19px; color: var(--muted); }
.omni input {
  flex: 1;
  min-width: 0;
  padding: 11px 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 15px;
}
.omni input::placeholder { color: var(--dim); }
.omni button {
  flex: 0 0 auto;
  padding: 11px 19px;
  border: 0;
  border-radius: 3px;
  background: var(--text);
  color: #0b0b0b;
  font: inherit;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}
.omni button:active { background: #d4d4d4; }
.section-label {
  margin: 24px 0 10px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .22em;
}
.sites {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 4px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
}
.sites::-webkit-scrollbar { display: none; }
.tile {
  flex: 0 0 88px;
  height: 116px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--panel);
  color: inherit;
  text-decoration: none;
  scroll-snap-align: start;
  transition: background .15s ease, border-color .15s ease;
}
.tile:hover, .tile:focus-visible {
  background: #171717;
  border-color: #a3a3a3;
}
.tile-logo {
  position: relative;
  width: 60px;
  height: 60px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--panel-2);
  overflow: hidden;
}
.tile-logo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 10px;
}
.fallback {
  color: var(--text);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: .02em;
}
.tile-name {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 600;
}
</style>
</head>
<body>
<main class="shell">
  <form class="omni" id="omni" autocomplete="off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/>
      <path d="M20 20l-3.2-3.2" stroke-linecap="round"/>
    </svg>
    <input id="q" type="text" inputmode="url" placeholder="Search or enter address" aria-label="Search or enter address" spellcheck="false">
    <button type="submit">Go</button>
  </form>

  <p class="section-label">TOP SITES</p>
  <nav class="sites" aria-label="Top sites">
    <a class="tile" href="https://www.google.com">
      <span class="tile-logo">
        <span class="fallback">G</span>
        <img src="https://www.google.com/s2/favicons?domain=google.com&amp;sz=64" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">
      </span>
      <span class="tile-name">Google</span>
    </a>
    <a class="tile" href="https://github.com">
      <span class="tile-logo">
        <span class="fallback">GH</span>
        <img src="https://github.com/fluidicon.png" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">
      </span>
      <span class="tile-name">GitHub</span>
    </a>
    <a class="tile" href="https://www.youtube.com">
      <span class="tile-logo">
        <span class="fallback">Y</span>
        <img src="https://www.google.com/s2/favicons?domain=youtube.com&amp;sz=64" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">
      </span>
      <span class="tile-name">YouTube</span>
    </a>
    <a class="tile" href="https://ksx.pages.dev">
      <span class="tile-logo">
        <span class="fallback">KS</span>
      </span>
      <span class="tile-name">KS Website</span>
    </a>
  </nav>
</main>
<script>
(function () {
  var input = document.getElementById('q');
  function navigate(raw) {
    var value = String(raw || '').trim();
    if (!value) return;
    if (/^https?:\/\//i.test(value)) {
      window.location.href = value;
      return;
    }
    if (/^[^\s/]+\.[^\s]{2,}(\/.*)?$/.test(value)) {
      window.location.href = 'https://' + value;
      return;
    }
    window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(value);
  }
  document.getElementById('omni').addEventListener('submit', function (event) {
    event.preventDefault();
    navigate(input.value);
  });
})();
</script>
</body>
</html>
