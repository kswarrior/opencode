    function getDataName(name) {
      if (typeof name === "boolean" || typeof name === "number") {
        return name.toString();
      }
    
      let retVal = "";
    
      for (let i = 0; i < name.length; i++) {
        if (i === 0) {
          retVal += name[i].toUpperCase();
        } else {
          if (name[i] >= "A" && name[i] <= "Z") {
            retVal += " ";
          }
          retVal += name[i];
        }
      }
      return retVal;
    }
    
    function getDataSummary(data) {
      if (data) {
        return data;
      }
      
      if (typeof data === "number" || typeof data === "boolean") {
        return data.toString();
      }
      
      if (typeof data === "object") {
        return JSON.stringify(data);
      }
    
      return "(not defined)";
    }  
    
    function getEmptySummary(data) {
    
      if (typeof data === "object") {
        return JSON.stringify(data);
      }
      
      if (typeof data === "number" || typeof data === "boolean") {
        return data.toString();
      }
    
      if (data) {
        return data;
      }
      
      return "";
    }  

    function getEffectiveMessage(reportObj, item) {
      if (item.m !== undefined) {
        return item.m;
      }

      if (reportObj.info === undefined || reportObj.info.summary === undefined) {
        return undefined;
      }

      let gen = reportObj.info.summary[item.gId];

      if (gen === undefined) {
        return undefined;
      }

      let genI = gen[item.gIx];
 
      if (genI === undefined) {
        return undefined;
      }

      return genI.defaultMessage;
    }

    function appendElement(parent, tag, text, className) {
      const el = document.createElement(tag);

      if (className) {
        el.className = className;
      }

      el.textContent = text;
      parent.appendChild(el);
      return el;
    }

    function appendSummaryRow(table, keyText, valueText) {
      const row = document.createElement("tr");
      appendElement(row, "td", keyText, "summary-key items-cell");

      table.appendChild(row);
    }

    function generateReports() {
      for (let i=0; i<_reportObjects.length; i++) {
        appendElement(document.body, "h1", _reportObjects[i].sourceName);

        appendElement(headerRow, "th", "Measure");
        appendElement(headerRow, "th", "Value");
        table.appendChild(headerRow);

        const info = _reportObjects[i].info;

            }

        }
        document.body.appendChild(table);
      }

        table.className = "items-table";

              table.appendChild(row);
            }
          }
        }
        document.body.appendChild(table);

    function getDescriptionForItemType(itemType) {
